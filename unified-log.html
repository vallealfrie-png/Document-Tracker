<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHMC Unified Document System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-print-color-adjust: exact; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        
        /* Dashboard Layout */
        .main-layout { max-width: 1000px; margin: auto; display: flex; flex-direction: column; gap: 20px; }
        .form-container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 12px; }
        .full-width { grid-column: span 2; }
        
        label { font-size: 0.75rem; font-weight: bold; color: #1a73ba; margin-bottom: 4px; text-transform: uppercase; }
        input { padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        
        button { padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-process { background: #1a73ba; color: white; width: 100%; }
        .btn-print { background: #28a745; color: white; width: 100%; display: none; margin-top: 10px; }

        /* --- PRINTABLE SLIP (A4 HALF PAGE) --- */
        #printable-slip {
            background: white;
            padding: 40px;
            display: none; 
            flex-direction: column;
            width: 100%;
            margin-top: 20px;
            border: 1px solid #eee;
        }

        /* Stretched Logo Header */
        .slip-header-stretched { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            border-bottom: 3px solid #000;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .slip-logo-large { width: 100%; max-width: 600px; object-fit: contain; margin-bottom: 10px; }
        
        .slip-body { display: flex; justify-content: space-between; align-items: flex-start; gap: 40px; }
        .details-area { flex-grow: 1; }
        .details-area h2 { margin: 0 0 20px 0; font-size: 22pt; text-transform: uppercase; border-left: 8px solid #1a73ba; padding-left: 15px; }
        
        .info-row { font-size: 12pt; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .info-row strong { color: #1a73ba; width: 120px; display: inline-block; }

        .qr-side { text-align: center; min-width: 200px; }
        .hex-display { font-family: monospace; font-size: 24pt; font-weight: bold; background: #000; color: #fff; padding: 10px; display: block; margin-top: 15px; border-radius: 4px; }

        @media print {
            body { background: white; padding: 0; }
            .form-container, h2, .btn-process, .btn-print { display: none !important; }
            #printable-slip { 
                display: flex !important; 
                position: absolute; top: 0; left: 0; 
                width: 210mm; height: 148mm;
                border: none;
            }
            @page { size: A4 portrait; margin: 0; }
        }
    </style>
</head>
<body>

    <h2 style="text-align:center; color: #1a73ba;">PHMC Digital Document Entry</h2>

    <div class="main-layout">
        <div class="form-container">
            <div class="form-grid">
                <div class="form-group">
                    <label>Category</label>
                    <input list="cat-list" id="category" placeholder="Type to create or select...">
                    <datalist id="cat-list"></datalist>
                </div>
                <div class="form-group">
                    <label>Project / Document Name</label>
                    <input type="text" id="project_name">
                </div>
                <div class="form-group full-width">
                    <label>Route Plan (Departments)</label>
                    <input type="text" id="departments" placeholder="e.g. Finance, Billing, Medical Records">
                </div>
                <div class="form-group">
                    <label>Originating Staff</label>
                    <input type="text" id="route_by">
                </div>
                <div class="form-group">
                    <label>Messenger</label>
                    <input type="text" id="takeout_by">
                </div>
            </div>
            
            <button class="btn-process" id="proc-btn" onclick="processAll()">SAVE & GENERATE SLIP</button>
            <button class="btn-print" id="print-btn" onclick="window.print()">PRINT DIGITAL ROUTING SLIP</button>
        </div>

        <div id="printable-slip">
            <div class="slip-header-stretched">
                <img src="https://i.imgur.com/VbZKWAf.png" class="slip-logo-large">
                <div style="font-size: 10pt; font-weight: bold; letter-spacing: 3px; color: #555;">DIGITAL TRACKING MANIFEST</div>
            </div>

            <div class="slip-body">
                <div class="details-area">
                    <h2 id="slip-proj">---</h2>
                    <div class="info-row"><strong>CATEGORY:</strong> <span id="slip-cat">---</span></div>
                    <div class="info-row"><strong>PREPARED:</strong> <span id="slip-route">---</span></div>
                    <div class="info-row"><strong>DATE:</strong> <span id="slip-date">---</span></div>
                    <div class="info-row"><strong>MESSENGER:</strong> <span id="slip-messenger">---</span></div>
                    
                    <div style="margin-top: 25px; padding: 15px; background: #f4f7f9; border-radius: 8px;">
                        <strong>DIGITAL ROUTE:</strong><br>
                        <span id="slip-depts" style="font-size: 11pt; color: #1a73ba;">---</span>
                    </div>
                </div>

                <div class="qr-side">
                    <div id="qr-target"></div>
                    <div id="display-hex" class="hex-display">-----</div>
                    <p style="font-size: 8pt; margin-top: 10px;">SCAN TO UPDATE STATUS</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient('https://tywhjkofayqhmwbpzvlg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5d2hqa29mYXlxaG13YnB6dmxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MzA2ODYsImV4cCI6MjA5MTIwNjY4Nn0.F-mFKAhn5kRtAU1XOM5jMiT4-zL3P6YJ7Rtj9VGatH4');

        // Load existing categories on startup
        async function loadCategories() {
            const { data } = await _supabase.from('combined_routing_logs').select('category');
            if (data) {
                const uniqueCats = [...new Set(data.map(item => item.category))];
                const list = document.getElementById('cat-list');
                list.innerHTML = uniqueCats.map(c => `<option value="${c}">`).join('');
            }
        }

        async function processAll() {
            const btn = document.getElementById('proc-btn');
            const cat = document.getElementById('category').value;
            const proj = document.getElementById('project_name').value;
            const deptInput = document.getElementById('departments').value;
            const routed = document.getElementById('route_by').value;
            const takeout = document.getElementById('takeout_by').value;

            if(!cat || !proj) { alert("Category and Project Name are required!"); return; }

            btn.disabled = true;
            btn.innerText = "SAVING DATA...";

            let isUnique = false;
            let hex = "";
            while(!isUnique) {
                hex = Math.floor(Math.random() * 0xfffff).toString(16).toUpperCase().padStart(5, '0');
                const { data } = await _supabase.from('combined_routing_logs').select('qr_code').eq('qr_code', hex);
                if(!data || data.length === 0) isUnique = true;
            }

            const deptArray = deptInput.split(',').map(d => d.trim()).filter(d => d !== "");
            const fullLink = `https://vallealfrie-png.github.io/Document-Tracker/track.html?id=${hex}`;

            const { error } = await _supabase.from('combined_routing_logs').insert([{
                category: cat,
                project_name: proj,
                qr_code: hex,
                qr_link: fullLink,
                departments: deptArray,
                route_by: routed,
                takeout_by: takeout,
                status: 'Active'
            }]);

            if(error) {
                alert("Error: " + error.message);
                btn.disabled = false;
            } else {
                renderSlip(cat, proj, hex, deptArray, routed, takeout, fullLink);
                document.getElementById('print-btn').style.display = 'block';
                btn.innerText = "DATA SAVED & READY";
                loadCategories(); // Refresh the list
            }
        }

        function renderSlip(cat, proj, hex, depts, routed, messenger, link) {
            document.getElementById('slip-cat').innerText = cat;
            document.getElementById('slip-proj').innerText = proj;
            document.getElementById('display-hex').innerText = hex;
            document.getElementById('slip-route').innerText = routed;
            document.getElementById('slip-messenger').innerText = messenger || "N/A";
            document.getElementById('slip-date').innerText = new Date().toLocaleDateString();
            document.getElementById('slip-depts').innerText = depts.length ? depts.join(' ➔ ') : "No fixed route set.";

            const qrContainer = document.getElementById('qr-target');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: link,
                width: 160, 
                height: 160,
                correctLevel: QRCode.CorrectLevel.H
            });
            document.getElementById('printable-slip').style.display = 'flex';
        }

        loadCategories();
    </script>
</body>
</html>
