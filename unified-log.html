<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHMC Document System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-print-color-adjust: exact; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        
        .main-layout { max-width: 900px; margin: auto; display: flex; flex-direction: column; gap: 20px; }
        
        .section-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 10px; }
        .full-width { grid-column: span 2; }
        
        label { font-size: 0.7rem; font-weight: bold; color: #1a73ba; margin-bottom: 3px; text-transform: uppercase; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
        
        button { padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #1a73ba; color: white; width: 100%; }
        .btn-success { background: #28a745; color: white; width: 100%; margin-top: 10px; }
        
        .reprint-box { border-top: 3px solid #666; margin-top: 10px; }
        .search-row { display: flex; gap: 20px; margin-top: 15px; align-items: center; }
        .search-row input { flex-grow: 1; height: 40px; }

        /* UIverse Animated Fetch Button */
        .uiverse-btn {
            position: relative; width: 120px; height: 40px; background-color: #000;
            display: flex; align-items: center; color: white; flex-direction: column;
            justify-content: center; border: none; padding: 12px; gap: 12px;
            border-radius: 8px; cursor: pointer; z-index: 1;
        }
        .uiverse-btn::before {
            content: ''; position: absolute; inset: 0; left: -4px; top: -1px; margin: auto;
            width: 128px; height: 48px; border-radius: 10px;
            background: linear-gradient(-45deg, #e81cff 0%, #40c9ff 100% );
            z-index: -10; pointer-events: none; transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .uiverse-btn::after {
            content: ""; z-index: -1; position: absolute; inset: 0;
            background: linear-gradient(-45deg, #fc00ff 0%, #00dbde 100% );
            transform: translate3d(0, 0, 0) scale(0.95); filter: blur(20px);
        }
        .uiverse-btn:hover::after { filter: blur(30px); }
        .uiverse-btn:hover::before { transform: rotate(-180deg); }
        .uiverse-btn:active::before { scale: 0.7; }

        /* PRINTABLE SLIP */
        #printable-slip { background: white; padding: 0 40px; display: none; flex-direction: column; width: 100%; }
        .slip-header { 
            width: 100%; display: flex; justify-content: center; padding: 20px 0;
            border-bottom: 4px solid #299c29; margin-bottom: 20px;
        }
        .slip-logo { width: 620px; height: auto; object-fit: contain; }
        
        .slip-body { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
        .details-area { flex: 1; }
        #slip-proj { margin: 0 0 12px 0; font-size: 20pt; color: #1a73ba; text-transform: uppercase; }
        
        .info-row { font-size: 12pt; margin-bottom: 6px; }
        .info-row strong { width: 140px; display: inline-block; color: #444; }

        .qr-side { text-align: center; padding-left: 30px; }
        .scan-instruction { 
            font-size: 11pt; 
            font-weight: bold; 
            color: #1a73ba; 
            margin-bottom: 8px; 
            text-transform: uppercase;
        }
        .hex-display { font-family: monospace; font-size: 22pt; font-weight: bold; border: 2px solid #000; padding: 5px 15px; display: block; margin-top: 10px; }

        .slogan {
            text-align: center; font-weight: bold; font-style: italic; font-size: 14pt;
            color: #299c29; margin-top: 25px; padding-bottom: 20px;
            border-bottom: 4px solid #299c29; letter-spacing: 1px;
        }

        @media print {
            body { background: white; padding: 0; }
            .section-box, h2:not(#slip-proj), button, .reprint-box { display: none !important; }
            #printable-slip { display: flex !important; position: absolute; top: 0; left: 0; width: 210mm; }
            @page { size: A4 portrait; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="section-box">
            <h3 style="margin-top:0; color:#1a73ba;">New Document Entry</h3>
            <div class="form-grid">
                <div class="form-group"><label>Category</label><input list="cat-list" id="category"><datalist id="cat-list"></datalist></div>
                <div class="form-group"><label>Project Name</label><input type="text" id="project_name"></div>
                <div class="form-group"><label>Department Origin</label><input type="text" id="origin_dept"></div>
                <div class="form-group"><label>Staff Name</label><input type="text" id="staff_name"></div>
                <div class="form-group full-width"><label>Route / Target Departments (Digital Log Only)</label><input type="text" id="departments" placeholder="e.g. Finance, Billing, HR"></div>
            </div>
            <button class="btn-primary" id="proc-btn" onclick="processAll()">SAVE & GENERATE</button>
        </div>

        <div class="section-box reprint-box">
            <label>Reprint Slip</label>
            <div class="search-row">
                <input type="text" id="reprint-id" placeholder="Enter Hex ID">
                <button class="uiverse-btn" onclick="reprintSlip()">FETCH</button>
            </div>
            <button class="btn-success" id="print-btn" onclick="window.print()" style="display:none;">🖨️ PRINT SLIP</button>
        </div>

        <div id="printable-slip">
            <div class="slip-header"><img src="https://i.imgur.com/5SCk9eU.jpeg" class="slip-logo"></div>
            <div class="slip-body">
                <div class="details-area">
                    <h2 id="slip-proj">---</h2>
                    <div class="info-row"><strong>CATEGORY:</strong> <span id="slip-cat">---</span></div>
                    <div class="info-row"><strong>ORIGIN DEPT:</strong> <span id="slip-origin">---</span></div>
                    <div class="info-row"><strong>STAFF:</strong> <span id="slip-staff">---</span></div>
                    <div class="info-row"><strong>DATE:</strong> <span id="slip-date">---</span></div>
                </div>
                <div class="qr-side">
                    <div class="scan-instruction">Scan Me to Update Us ↓</div>
                    <div id="qr-target"></div>
                    <div id="display-hex" class="hex-display">-----</div>
                </div>
            </div>
            <div class="slogan">Dedicated To Life</div>
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient('https://onozvyuowebbwuvcqlzt.supabase.co/rest/v1/', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ub3p2eXVvd2ViYnd1dmNxbHp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDc1NTQsImV4cCI6MjA5MjQyMzU1NH0.1EddoNcvgmQpO2eVZ8d4tXcDOJJC5BJNOckRRKJOzh0');

        async function loadCategories() {
            const { data } = await _supabase.from('combined_routing_logs').select('category');
            if (data) {
                const uniqueCats = [...new Set(data.map(item => item.category))];
                document.getElementById('cat-list').innerHTML = uniqueCats.map(c => `<option value="${c}">`).join('');
            }
        }

        async function processAll() {
            const btn = document.getElementById('proc-btn');
            const cat = document.getElementById('category').value;
            const proj = document.getElementById('project_name').value;
            const origin = document.getElementById('origin_dept').value;
            const staff = document.getElementById('staff_name').value;
            const depts = document.getElementById('departments').value;

            if(!cat || !proj) return alert("Fill Name and Category");
            btn.disabled = true;

            let hex = Math.floor(Math.random() * 0xfffff).toString(16).toUpperCase().padStart(5, '0');
            const fullLink = `https://vallealfrie-png.github.io/Document-Tracker/track.html?id=${hex}`;

            const { error } = await _supabase.from('combined_routing_logs').insert([{
                category: cat, project_name: proj, qr_code: hex, qr_link: fullLink, 
                origin_dept: origin, staff_name: staff, departments: depts.split(','), status: 'Active'
            }]);

            if(!error) {
                renderSlip(cat, proj, hex, origin, staff, fullLink);
                document.getElementById('print-btn').style.display = 'block';
                btn.innerText = "SAVED";
                loadCategories();
            } else { alert("Error: " + error.message); btn.disabled = false; }
        }

        async function reprintSlip() {
            const searchId = document.getElementById('reprint-id').value.toUpperCase().trim();
            if(!searchId) return;
            const { data } = await _supabase.from('combined_routing_logs').select('*').eq('qr_code', searchId).single();
            if (data) {
                renderSlip(data.category, data.project_name, data.qr_code, data.origin_dept, data.staff_name, data.qr_link);
                document.getElementById('print-btn').style.display = 'block';
            } else { alert("ID not found."); }
        }

        function renderSlip(cat, proj, hex, origin, staff, link) {
            document.getElementById('slip-cat').innerText = cat;
            document.getElementById('slip-proj').innerText = proj;
            document.getElementById('display-hex').innerText = hex;
            document.getElementById('slip-origin').innerText = origin || "N/A";
            document.getElementById('slip-staff').innerText = staff || "N/A";
            document.getElementById('slip-date').innerText = new Date().toLocaleDateString();

            const qrContainer = document.getElementById('qr-target');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, { text: link, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.H });
            document.getElementById('printable-slip').style.display = 'flex';
        }

        loadCategories();
    </script>
</body>
</html>
