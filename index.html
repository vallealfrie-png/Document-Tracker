<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHMC Document Control - Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #1a73ba;
            --primary-hover: #145b94;
            --bg: #f0f2f5;
            --dark: #343a40;
            --error: #d9534f;
            --success: #28a745;
            --github: #24292e;
            --google: #4285f4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .auth-container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .brand-section { text-align: center; margin-bottom: 30px; }
        .brand-section img { height: 55px; margin-bottom: 12px; }
        .brand-section h1 { font-size: 1.4rem; color: #333; margin-bottom: 5px; }
        .brand-section p { font-size: 0.85rem; color: #666; }

        .form-group { margin-bottom: 18px; position: relative; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #555; text-transform: uppercase; margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px;
            font-size: 0.95rem; transition: border-color 0.2s; outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); }

        .forgot-link {
            text-align: right; margin-top: -10px; margin-bottom: 15px; font-size: 0.85rem;
        }
        .forgot-link span { color: var(--primary); cursor: pointer; }
        .forgot-link span:hover { text-decoration: underline; }

        .auth-btn {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: background 0.2s; margin-top: 10px;
        }
        .auth-btn:hover { background: var(--primary-hover); }

        .divider {
            display: flex; align-items: center; text-align: center;
            margin: 20px 0; color: #888; font-size: 0.85rem;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e0e0e0; }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .social-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 12px; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
            cursor: pointer; transition: opacity 0.2s; border: none; color: white;
        }
        .social-btn:hover { opacity: 0.9; }
        .btn-google { background: var(--google); }
        .btn-github { background: var(--github); }

        .toggle-link { text-align: center; margin-top: 25px; font-size: 0.9rem; color: #666; }
        .toggle-link span { color: var(--primary); cursor: pointer; font-weight: 600; }
        .toggle-link span:hover { text-decoration: underline; }

        .alert-box {
            padding: 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 500;
            margin-bottom: 20px; display: none; text-align: center;
        }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        
        .form-view { display: none; }
        .form-view.active { display: block; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="brand-section">
        <img src="https://i.imgur.com/VbZKWAf.png" alt="PHMC Logo">
        <h1>Document Control Portal</h1>
        <p id="portal-subtitle">Sign in to manage active routing logs</p>
    </div>

    <div id="alert-msg" class="alert-box"></div>

    <!-- LOGIN FORM CONTAINER -->
    <div id="login-view" class="form-view active">
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" required placeholder="name@perpetualhelp.com.ph">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <div class="forgot-link">
                <span onclick="switchView('forgot')">Forgot Password?</span>
            </div>
            <button type="submit" class="auth-btn">Sign In</button>
        </form>

        <div class="divider">or continue with</div>
        <div class="social-grid">
            <button class="social-btn btn-google" onclick="handleSocialLogin('google')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1c-6.075 0-11 4.925-11 11s4.925 11 11 11c6.34 0 10.557-4.462 10.557-10.741 0-.724-.077-1.281-.174-1.684H12.24z"/></svg>
                Google
            </button>
            <button class="social-btn btn-github" onclick="handleSocialLogin('github')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
                GitHub
            </button>
        </div>

        <div class="toggle-link">
            New to the portal? <span onclick="switchView('register')">Create an Account</span>
        </div>
    </div>

    <!-- REGISTRATION FORM CONTAINER -->
    <div id="register-view" class="form-view">
        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Corporate Email</label>
                <input type="email" id="reg-email" required placeholder="your.name@perpetualhelp.com.ph">
            </div>
            <div class="form-group">
                <label>Department</label>
                <select id="reg-dept" required>
                    <option value="" disabled selected>Select your department</option>
                    <option value="Medical Records">Medical Records</option>
                    <option value="Nursing Office">Nursing Office</option>
                    <option value="Human Resources">Human Resources</option>
                    <option value="Finance">Finance</option>
                    <option value="Purchasing">Purchasing</option>
                    <option value="IT Department">IT Department</option>
                </select>
            </div>
            <div class="form-group">
                <label>Team / Section (Optional)</label>
                <input type="text" id="reg-team" placeholder="e.g., Inbound Ops, Billing Team">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" required minlength="6" placeholder="Minimum 6 characters">
            </div>
            <button type="submit" class="auth-btn">Register Account</button>
        </form>
        <div class="toggle-link">
            Already have an account? <span onclick="switchView('login')">Sign In here</span>
        </div>
    </div>

    <!-- FORGOT PASSWORD FORM CONTAINER -->
    <div id="forgot-view" class="form-view">
        <form id="forgot-form" onsubmit="handleForgotPassword(event)">
            <div class="form-group">
                <label>Enter Your Registered Email</label>
                <input type="email" id="forgot-email" required placeholder="name@perpetualhelp.com.ph">
            </div>
            <button type="submit" class="auth-btn">Send Reset Link</button>
        </form>
        <div class="toggle-link">
            Back to <span onclick="switchView('login')">Sign In</span>
        </div>
    </div>

    <!-- NEW PASSWORD (UPDATE) CONTAINER -->
    <div id="reset-view" class="form-view">
        <form id="reset-form" onsubmit="handleUpdatePassword(event)">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="reset-password" required minlength="6" placeholder="Minimum 6 characters">
            </div>
            <button type="submit" class="auth-btn">Update Password</button>
        </form>
    </div>
</div>

<script>
    const _supabase = supabase.createClient('https://onozvyuowebbwuvcqlzt.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ub3p2eXVvd2ViYnd1dmNxbHp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDc1NTQsImV4cCI6MjA5MjQyMzU1NH0.1EddoNcvgmQpO2eVZ8d4tXcDOJJC5BJNOckRRKJOzh0');

    function showAlert(message, type = 'error') {
        const alertBox = document.getElementById('alert-msg');
        alertBox.innerText = message;
        alertBox.className = `alert-box alert-${type}`;
        alertBox.style.display = 'block';
    }

    function clearAlert() {
        document.getElementById('alert-msg').style.display = 'none';
    }

    function switchView(view) {
        clearAlert();
        document.querySelectorAll('.form-view').forEach(el => el.classList.remove('active'));
        
        if (view === 'register') {
            document.getElementById('register-view').classList.add('active');
            document.getElementById('portal-subtitle').innerText = "Register your internal employee profile";
        } else if (view === 'forgot') {
            document.getElementById('forgot-view').classList.add('active');
            document.getElementById('portal-subtitle').innerText = "Recover your recovery credentials";
        } else if (view === 'reset') {
            document.getElementById('reset-view').classList.add('active');
            document.getElementById('portal-subtitle').innerText = "Establish a strong new account password";
        } else {
            document.getElementById('login-view').classList.add('active');
            document.getElementById('portal-subtitle').innerText = "Sign in to manage active routing logs";
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        clearAlert();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) {
            showAlert(error.message, 'error');
        } else {
            showAlert("Sign in successful! Redirecting...", "success");
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
        }
    }

    async function handleSocialLogin(provider) {
        clearAlert();
        const { data, error } = await _supabase.auth.signInWithOAuth({
            provider: provider,
            options: { redirectTo: 'https://vallealfrie-png.github.io/Document-Tracker/dashboard.html' }
        });
        if (error) showAlert(error.message, 'error');
    }

    async function handleRegister(e) {
        e.preventDefault();
        clearAlert();
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const department = document.getElementById('reg-dept').value;
        const team = document.getElementById('reg-team').value || 'General';
        const password = document.getElementById('reg-password').value;

        const { data, error } = await _supabase.auth.signUp({
            email: email,
            password: password,
            options: {
                emailRedirectTo: 'https://vallealfrie-png.github.io/Document-Tracker/',
                data: { name, department, team }
            }
        });

        if (error) {
            showAlert(error.message, 'error');
        } else {
            showAlert("Registration complete! Check your email for the activation link.", "success");
            document.getElementById('register-form').reset();
            setTimeout(() => { switchView('login'); }, 3000);
        }
    }

    // NEW: Handle Requesting Password Reset Link
    async function handleForgotPassword(e) {
        e.preventDefault();
        clearAlert();
        const email = document.getElementById('forgot-email').value;

        const { data, error } = await _supabase.auth.resetPasswordForEmail(email, {
            redirectTo: 'https://vallealfrie-png.github.io/Document-Tracker/?view=reset',
        });

        if (error) {
            showAlert(error.message, 'error');
        } else {
            showAlert("Password reset link sent! Please check your corporate inbox.", "success");
            document.getElementById('forgot-form').reset();
        }
    }

    // NEW: Handle Saving the Newly Entered Password
    async function handleUpdatePassword(e) {
        e.preventDefault();
        clearAlert();
        const newPassword = document.getElementById('reset-password').value;

        const { data, error } = await _supabase.auth.updateUser({ password: newPassword });

        if (error) {
            showAlert(error.message, 'error');
        } else {
            showAlert("Password updated successfully! Redirecting to login view...", "success");
            document.getElementById('reset-form').reset();
            setTimeout(() => {
                // Clear URL parameters cleanly and go back to sign in
                window.history.replaceState({}, document.title, window.location.pathname);
                switchView('login');
            }, 2500);
        }
    }

    // Lifecycle Routing Watcher
    document.addEventListener('DOMContentLoaded', async () => {
        // Detect if the user arrived here via clicking a password reset email link
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('view') === 'reset' || window.location.hash.includes('type=recovery')) {
            switchView('reset');
            return;
        }

        const { data: { session } } = await _supabase.auth.getSession();
        if (session && !window.location.hash.includes('type=recovery')) {
            window.location.href = 'dashboard.html';
        }
    });
</script>
</body>
</html>
