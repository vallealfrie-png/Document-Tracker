<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Landscape Signatory Card</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-red: #d32f2f;
            --primary-green: #007b43;
        }

        body { 
            font-family: Arial, sans-serif; 
            background: #525659; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
        }

        /* Landscape Orientation */
        .page {
            background: white;
            width: 11in; 
            height: 8.5in;
            padding: 0.5in;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* QR Code Top Right */
        #qrcode {
            position: absolute;
            top: 40px;
            right: 40px;
            z-index: 10;
        }

        /* Header Info  */
        .header {
            border-bottom: 3px solid var(--primary-green);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .hospital-name {
            color: var(--primary-red);
            font-size: 24pt;
            font-weight: bold;
            margin: 0;
            text-transform: uppercase;
        }

        .location {
            font-size: 14pt;
            font-weight: bold;
            margin: 0;
        }

        /* Table Content  */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .info-table td {
            border: 1px solid #000;
            padding: 10px;
        }

        .label {
            font-weight: bold;
            font-size: 10pt;
            background: #f0f0f0;
        }

        .editable-content {
            width: 100%;
            border: none;
            font-size: 12pt;
            outline: none;
            background: transparent;
        }

        /* Image Upload Area (Center) */
        .upload-container {
            flex-grow: 1;
            border: 2px dashed #ccc;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .upload-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #file-input { display: none; }

        .upload-placeholder {
            color: #999;
            text-align: center;
            cursor: pointer;
        }

        /* Logo Lower Left */
        .footer-logo {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 180px;
        }

        .controls { margin-bottom: 20px; }
        
        button { 
            padding: 10px 20px; 
            cursor: pointer; 
            background: var(--primary-green); 
            color: white; 
            border: none; 
            border-radius: 4px; 
        }

        @media print {
            body { background: white; padding: 0; }
            .page { box-shadow: none; border: none; width: 11in; height: 8.5in; }
            .controls, .upload-placeholder { display: none; }
            .upload-container { border: none; }
            @page { size: landscape; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="window.print()">Print Document</button>
    </div>

    <div class="page">
        <div id="qrcode"></div>

        <div class="header">
            <p class="hospital-name">PERPETUAL HELP</p>
            <p class="location">MEDICAL CENTER - LAS PIÑAS</p>
        </div>

        <table class="info-table">
            <tr>
                <td class="label">PROJECT:</td>
                <td style="width: 50%"><input type="text" class="editable-content" placeholder="Enter Project Name"></td>
                <td class="label">EMAILED:</td>
                <td><input type="text" class="editable-content" value="04 08 2026"></td>
            </tr>
            <tr>
                <td class="label">CREATED BY:</td>
                <td colspan="3"><input type="text" class="editable-content" value="Department/Center"></td>
            </tr>
        </table>

        <div class="upload-container" onclick="document.getElementById('file-input').click()">
            <div class="upload-placeholder" id="placeholder-text">
                <p>Click to upload project image or drag and drop</p>
            </div>
            <img id="display-image" src="" style="display:none;">
            <input type="file" id="file-input" accept="image/*" onchange="previewImage(event)">
        </div>

        <img src="https://i.imgur.com/VbZKWAf.png" class="footer-logo" alt="Logo">
    </div>

    <script>
        // Initialize QR Code 
        const qrcode = new QRCode(document.getElementById("qrcode"), {
            text: "PHMC-DOC-2026",
            width: 100,
            height: 100
        });

        // Image Preview Function
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('display-image');
                const placeholder = document.getElementById('placeholder-text');
                output.src = reader.result;
                output.style.display = 'block';
                placeholder.style.display = 'none';
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>
</html>
