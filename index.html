<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signatory Project Template</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Helvetica', Arial, sans-serif; background: #525659; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* Landscape setup */
        .page {
            background: white;
            width: 11in;
            height: 8.5in;
            padding: 0;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Blue Bar */
        .header-blue-bar {
            background-color: #1a73ba; /* Matching the blue in your image */
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-label { font-size: 18pt; font-weight: bold; }
        .date-section { font-size: 10pt; display: flex; gap: 10px; align-items: center; }

        /* Secondary Header Row */
        .sub-header {
            display: grid;
            grid-template-columns: 200px 1fr 250px;
            border-bottom: 2px solid #1a73ba;
        }

        .created-by-box {
            padding: 5px 10px;
            font-size: 8pt;
            font-weight: bold;
            border-right: 2px solid #1a73ba;
        }

        .dept-box {
            padding: 10px;
            font-size: 14pt;
            font-weight: bold;
            border-right: 2px solid #1a73ba;
        }

        /* Hospital Logo Green Section */
        .hospital-branding {
            background-color: #007b43;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 80px;
        }

        .hospital-branding img { max-width: 100%; max-height: 100%; }

        /* QR Code positioning (Top Right) */
        #qrcode {
            position: absolute;
            top: 60px;
            right: 20px;
            border: 5px solid white;
        }

        /* Image Upload Area */
        .upload-container {
            flex-grow: 1;
            border: 1px dashed #ccc;
            margin: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .upload-container img { max-height: 100%; max-width: 100%; }

        /* Signatory Boxes Grid */
        .signatory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 2px solid #1a73ba;
        }

        .sig-box {
            border-right: 1px solid #1a73ba;
            border-bottom: 1px solid #1a73ba;
            padding: 10px;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .sig-box:last-child { border-right: none; }

        .input-name {
            border: none;
            border-bottom: 1px solid #000;
            font-weight: bold;
            text-align: center;
            width: 100%;
            outline: none;
            font-size: 11pt;
        }

        .input-title {
            border: none;
            text-align: center;
            width: 100%;
            outline: none;
            font-size: 9pt;
            color: #555;
            margin-top: 4px;
        }

        /* Footer Logo */
        .footer-logo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
        }

        .controls { margin-bottom: 10px; }
        @media print {
            .controls, .upload-placeholder { display: none; }
            body { background: white; padding: 0; }
            .page { box-shadow: none; }
            @page { size: landscape; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="window.print()" style="padding:10px 20px; background:#1a73ba; color:white; border:none; border-radius:5px; cursor:pointer;">Print Card</button>
    </div>

    <div class="page">
        <div id="qrcode"></div>

        <div class="header-blue-bar">
            <div class="project-label">PROJECT: <input type="text" style="background:transparent; border:none; color:white; font-size:18pt; width:400px; outline:none;" placeholder="TITLE HERE"></div>
            <div class="date-section">
                <span>FA ● EMAILED ●</span>
                <input type="text" value="04 | 08 | 2026" style="background:white; border:none; padding:2px 5px; width:100px; text-align:center;">
            </div>
        </div>

        <div class="sub-header">
            <div class="created-by-box">CREATED BY :</div>
            <div class="dept-box"><input type="text" class="editable-content" style="border:none; width:100%; outline:none;" value="Department/Center"></div>
        </div>

        <div class="hospital-branding">
            <img src="https://i.imgur.com/VbZKWAf.png" alt="PHMC Logo">
        </div>

        <div class="upload-container" onclick="document.getElementById('file-input').click()">
            <span class="upload-placeholder">Click to upload project photo</span>
            <img id="preview" src="">
            <input type="file" id="file-input" hidden onchange="loadFile(event)">
        </div>

        <div class="signatory-grid">
            <div class="sig-box">
                <input type="text" class="input-name" placeholder="FULL NAME">
                <input type="text" class="input-title" placeholder="Position / Title">
            </div>
            <div class="sig-box">
                <input type="text" class="input-name" placeholder="FULL NAME">
                <input type="text" class="input-title" placeholder="Position / Title">
            </div>
            <div class="sig-box">
                <input type="text" class="input-name" placeholder="FULL NAME">
                <input type="text" class="input-title" placeholder="Position / Title">
            </div>
            <div class="sig-box">
                <input type="text" class="input-name" placeholder="FULL NAME">
                <input type="text" class="input-title" placeholder="Position / Title">
            </div>
        </div>

        <img src="https://i.imgur.com/VbZKWAf.png" class="footer-logo">
    </div>

    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "PROJECT-VERIFY-2026",
            width: 80,
            height: 80
        });

        var loadFile = function(event) {
            var output = document.getElementById('preview');
            output.src = URL.createObjectURL(event.target.files[0]);
            document.querySelector('.upload-placeholder').style.display = 'none';
        };
    </script>
</body>
</html>
