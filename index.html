<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editable Signatory Card</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-red: #d32f2f;
            --primary-green: #007b43;
        }

        body { font-family: Arial, sans-serif; background: #525659; display: flex; flex-direction: column; align-items: center; padding: 20px; }

        /* Document Container */
        .page {
            background: white;
            width: 8.5in; /* Standard Letter Size */
            min-height: 5in;
            padding: 0.5in;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        /* Header Styling */
        .header {
            border-bottom: 3px solid var(--primary-green);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .hospital-name {
            color: var(--primary-red);
            font-size: 24pt;
            font-weight: bold;
            margin: 0;
            letter-spacing: 1px;
        }

        .location {
            font-size: 14pt;
            font-weight: bold;
            margin: 0;
        }

        /* QR Code Top Right */
        #qrcode {
            position: absolute;
            top: 40px;
            right: 40px;
        }

        /* Editable Table */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .info-table td {
            border: 1px solid #000;
            padding: 10px;
            vertical-align: top;
        }

        .label {
            font-weight: bold;
            font-size: 10pt;
            width: 15%;
        }

        /* Editable Input Fields */
        .editable-content {
            width: 95%;
            border: none;
            font-size: 12pt;
            outline: none;
            resize: none;
            display: block;
        }

        .editable-content:focus { background: #fffde7; }

        /* UI Buttons */
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; cursor: pointer; background: var(--primary-green); color: white; border: none; border-radius: 4px; font-weight: bold; }

        /* PRINT STYLES */
        @media print {
            body { background: white; padding: 0; }
            .page { box-shadow: none; border: none; width: 100%; }
            .controls { display: none; }
            .editable-content:focus { background: transparent; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="window.print()">Print to PDF / Paper</button>
    </div>

    <div class="page">
        <div id="qrcode"></div>

        <div class="header">
            <p class="hospital-name">PERPETUAL HELP</p>
            <p class="location">MEDICAL CENTER - LAS PIÑAS</p>
        </div>

        <table class="info-table">
            <tr>
                <td class="label">PROJECT:</td>
                <td>
                    <textarea class="editable-content" rows="2">Enter Project Name...</textarea>
                </td>
                <td class="label" style="width:10%">EMAILED:</td>
                <td style="width:20%">
                    <input type="text" class="editable-content" value="04 08 2026">
                </td>
            </tr>
            <tr>
                <td class="label">CREATED BY:</td>
                <td colspan="3">
                    <textarea class="editable-content">Department/Center</textarea>
                </td>
            </tr>
        </table>
    </div>

    <script>
        // Generate QR code based on the Project Name automatically
        const qrContainer = document.getElementById("qrcode");
        const qr = new QRCode(qrContainer, {
            text: "VERIFICATION-ID-12345",
            width: 90,
            height: 90
        });

        // Optional: Make QR update when typing in Project field
        const projectInput = document.querySelector('.editable-content');
        projectInput.addEventListener('input', (e) => {
            qr.clear();
            qr.makeCode(e.target.value || "Empty");
        });
    </script>
</body>
</html>
