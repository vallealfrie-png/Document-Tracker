<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHMC Real-Time Project System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-print-color-adjust: exact; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #525659; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .page {
            background: white;
            width: 11in;
            height: 8.5in;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Branding Section */
        .hospital-branding-header { height: 100px; width: 300px; display: flex; align-items: center; padding: 20px; }
        .hospital-branding-header img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* QR Code Container - Real Time */
        .qr-container {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: center;
        }
        #qrcode { 
            background: white; 
            padding: 5px; 
            border: 1px solid #eee; 
            width: 110px; 
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #project-id-text { font-size: 11pt; font-weight: bold; color: #1a73ba; margin-top: 5px; font-family: monospace; }

        /* Main Image Area - STRICT AUTOFIT */
        .main-content-area {
            flex: 1;
            margin: 0 20px;
            border: 2px dashed #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            overflow: hidden; 
        }
        #img-preview { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .upload-hint { color: #999; cursor: pointer; text-align: center; font-size: 14pt; }

        /* Bottom Section */
        .bottom-container { width: 100%; margin-top: auto; }

        .info-bar {
            background-color: #1a73ba;
            color: white;
            display: grid;
            grid-template-columns: 1.5fr 1fr 200px;
            padding: 12px 20px;
            align-items: center;
        }
        .info-bar input { background: transparent; border: none; color: white; border-bottom: 1px solid rgba(255,255,255,0.4); outline: none; width: 75%; font-size: 11pt; }

        .signatory-grid { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; }
        .sig-box {
            border: 0.5px solid #1a73ba;
            height: 130px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .sig-label { font-size: 8pt; font-weight: bold; color: #1a73ba; text-transform: uppercase; }
        .sig-inputs { display: flex; flex-direction: column; align-items: center; }
        .input-name { border: none; border-bottom: 1px solid #000; font-weight: bold; text-align: center; width: 90%; outline: none; font-size: 11pt; }
        .input-title { border: none; text-align: center; width: 90%; outline: none; font-size: 9pt; color: #555; }

        /* UI Controls */
        .controls { margin-bottom: 10px; display: flex; gap: 10px; }
        button { padding: 12px 30px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-save { background: #1a73ba; }
        .btn-save:hover { background: #155a8a; }
        .btn-print { background: #007b43; }

        @media print {
            .controls, .upload-hint { display: none; }
            body { background: white; padding: 0; }
            .page { box-shadow: none; border: none; width: 11in; height: 8.5in; }
            .main-content-area { border: none; }
            @page { size: landscape; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn-save" onclick="saveToSupabase()">1. SAVE TO SUPABASE</button>
        <button class="btn-print" onclick="window.print()">2. PRINT DOCUMENT</button>
    </div>

    <div class="page">
        <div class="hospital-branding-header">
            <img src="https://i.imgur.com/VbZKWAf.png" alt="PHMC Logo">
        </div>

        <div class="qr-container">
            <div id="qrcode"></div>
            <div id="project-id-text">INITIALIZING...</div>
        </div>

        <div class="main-content-area" onclick="document.getElementById('file-input').click()">
            <div id="hint" class="upload-hint">
                <strong>[ CLICK TO UPLOAD PROJECT IMAGE ]</strong>
            </div>
            <img id="img-preview">
            <input type="file" id="file-input" hidden accept="image/*" onchange="previewFile(event)">
        </div>

        <div class="bottom-container">
            <div class="info-bar">
                <div><strong>PROJECT:</strong> <input type="text" id="proj_name" placeholder="Type Project Name..."></div>
                <div><strong>DEPARTMENT:</strong> <input type="text" id="dept_name" placeholder="Type Department..."></div>
                <div style="font-size: 9pt; text-align: right;"><strong>EMAILED:</strong> 04 | 08 | 2026</div>
            </div>

            <div class="signatory-grid">
                <div class="sig-box">
                    <span class="sig-label">Created By:</span>
                    <div class="sig-inputs"><input type="text" id="n1" class="input-name" placeholder="Name"><input type="text" id="p1" class="input-title" placeholder="Position"></div>
                </div>
                <div class="sig-box">
                    <span class="sig-label">Supervisor/Manager:</span>
                    <div class="sig-inputs"><input type="text" id="n2" class="input-name" placeholder="Name"><input type="text" id="p2" class="input-title" placeholder="Position"></div>
                </div>
                <div class="sig-box">
                    <span class="sig-label">Department Head:</span>
                    <div class="sig-inputs"><input type="text" id="n3" class="input-name" placeholder="Name"><input type="text" id="p3" class="input-title" placeholder="Position"></div>
                </div>
                <div class="sig-box">
                    <span class="sig-label">Approved By:</span>
                    <div class="sig-inputs"><input type="text" id="n4" class="input-name" placeholder="Name"><input type="text" id="p4" class="input-title" placeholder="Position"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SUPABASE CONFIG ---
        const _supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');
        let currentProjectNo = "";

        // --- 2. INSTANT LOADING LOGIC ---
        // This ensures the QR and ID load the moment you open the browser
        window.onload = function() {
            // Generate Random 5-digit Hex
            const hex = Math.floor(Math.random() * 0xfffff).toString(16).toUpperCase().padStart(5, '0');
            currentProjectNo = `MKTG-${hex}`;
            
            // Update the Display ID
            document.getElementById('project-id-text').innerText = `ID: ${currentProjectNo}`;

            // Generate the QR Code
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = ""; // Clear
            new QRCode(qrContainer, {
                text: `https://your-domain.com/verify?id=${currentProjectNo}`,
                width: 100,
                height: 100,
                correctLevel: QRCode.CorrectLevel.H
            });
        };

        // --- 3. IMAGE PREVIEW ---
        function previewFile(event) {
            const output = document.getElementById('img-preview');
            const hint = document.getElementById('hint');
            const file = event.target.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    output.src = e.target.result;
                    output.style.display = 'block';
                    hint.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        // --- 4. SUPABASE SAVE FUNCTION ---
        async function saveToSupabase() {
            const file = document.getElementById('file-input').files[0];
            if (!file) { alert("Please upload a project photo first!"); return; }

            // A. Upload photo to Supabase Storage
            const { data: storageData, error: storageError } = await _supabase.storage
                .from('project-images')
                .upload(`${currentProjectNo}.png`, file);

            if (storageError) { alert("Upload error: " + storageError.message); return; }

            const publicUrl = _supabase.storage.from('project-images').getPublicUrl(`${currentProjectNo}.png`).data.publicUrl;

            // B. Insert project data to Table
            const { error: dbError } = await _supabase.from('projects').insert([{
                project_no: currentProjectNo,
                project_name: document.getElementById('proj_name').value,
                department: document.getElementById('dept_name').value,
                emailed_date: "04/08/2026",
                image_url: publicUrl,
                created_by_name: document.getElementById('n1').value,
                created_by_pos: document.getElementById('p1').value,
                supervisor_name: document.getElementById('n2').value,
                supervisor_pos: document.getElementById('p2').value,
                dept_head_name: document.getElementById('n3').value,
                dept_head_pos: document.getElementById('p3').value,
                approved_by_name: document.getElementById('n4').value,
                approved_by_pos: document.getElementById('p4').value
            }]);

            if (dbError) alert("Database save error: " + dbError.message);
            else alert("Successfully saved Project: " + currentProjectNo);
        }
    </script>
</body>
</html>
