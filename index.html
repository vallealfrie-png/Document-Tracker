<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHMC Project Management System - Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-print-color-adjust: exact; }
        body { font-family: 'Helvetica', Arial, sans-serif; background: #525659; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        /* The Container: Fixed to 1 page landscape */
        .page {
            background: white;
            width: 11in;
            height: 8.5in;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden; /* Prevents content from leaking to page 2 */
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Logo Area */
        .hospital-branding-header {
            height: 100px;
            width: 300px;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        .hospital-branding-header img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* QR Code & ID - Forced Visibility */
        .qr-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 999;
            text-align: center;
        }
        #qrcode { 
            background: white; 
            padding: 5px; 
            border: 1px solid #ddd; 
            width: 100px; 
            height: 100px; 
            display: block;
        }
        #project-id-text { font-size: 10pt; font-weight: bold; color: #1a73ba; margin-top: 5px; display: block; }

        /* Main Image Area - FIXED TO PREVENT LEAKING */
        .main-content-area {
            flex: 1; /* Takes up remaining space between header and footer */
            margin: 0 20px;
            border: 2px dashed #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            overflow: hidden; /* Contains the image */
            position: relative;
        }
        
        /* This ensures the image NEVER exceeds the box boundaries */
        #img-preview { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            display: none; 
        }

        .upload-hint { color: #999; cursor: pointer; text-align: center; }

        /* Bottom Section */
        .bottom-container { width: 100%; margin-top: auto; }

        .info-bar {
            background-color: #1a73ba;
            color: white;
            display: grid;
            grid-template-columns: 1.5fr 1fr 200px;
            padding: 12px 20px;
            align-items: center;
        }
        .info-bar input { background: transparent; border: none; color: white; border-bottom: 1px solid rgba(255,255,255,0.4); outline: none; width: 70%; font-size: 11pt; }

        .signatory-grid { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; }
        .sig-box {
            border: 0.5px solid #1a73ba;
            height: 130px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .sig-label { font-size: 8pt; font-weight: bold; color: #1a73ba; text-transform: uppercase; }
        .sig-inputs { display: flex; flex-direction: column; align-items: center; }
        .input-name { border: none; border-bottom: 1px solid #000; font-weight: bold; text-align: center; width: 90%; outline: none; font-size: 11pt; }
        .input-title { border: none; text-align: center; width: 90%; outline: none; font-size: 9pt; color: #555; }

        .controls { margin-bottom: 10px; display: flex; gap: 10px; }
        button { padding: 10px 25px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
        .btn-save { background: #1a73ba; }
        .btn-print { background: #007b43; }

        @media print {
            .controls { display: none; }
            body { background: white; padding: 0; }
            .page { box-shadow: none; border: none; width: 11in; height: 8.5in; }
            .main-content-area { border: none; }
            .upload-hint { display: none; }
            @page { size: landscape; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn-save" onclick="saveToSupabase()">SAVE PROJECT</button>
        <button class="btn-print" onclick="window.print()">PRINT</button>
    </div>

    <div class="page">
        <div class="hospital-branding-header">
            <img src="https://i.imgur.com/VbZKWAf.png" alt="PHMC Logo">
        </div>

        <div class="qr-container">
            <div id="qrcode"></div>
            <div id="project-id-text">ID: MKTG-XXXXX</div>
        </div>

        <div class="main-content-area" onclick="document.getElementById('file-input').click()">
            <div id="hint" class="upload-hint">
                <strong>[ CLICK TO UPLOAD PROJECT IMAGE ]</strong><br>
                <span>Image will auto-fit inside this box</span>
            </div>
            <img id="img-preview">
            <input type="file" id="file-input" hidden accept="image/*" onchange="previewFile(event)">
        </div>

        <div class="bottom-container">
            <div class="info-bar">
                <div><strong>PROJECT:</strong> <input type="text" id="proj_name" placeholder="Enter Name"></div>
                <div><strong>DEPARTMENT:</strong> <input type="text" id="dept_name" placeholder="Enter Dept"></div>
                <div style="font-size: 9pt; text-align: right;"><strong>EMAILED:</strong> 04 | 08 | 2026</div>
            </div>

            <div class="signatory-grid">
                <div class="sig-box">
                    <span class="sig-label">Created By:</span>
                    <div class="sig-inputs"><input type="text" id="n1" class="input-name" placeholder="Name"><input type="text" id="p1" class="input-title" placeholder="Position"></div>
                </div>
                <div class="sig-box">
                    <span class="sig-label">Supervisor/Manager:</span>
                    <div class="sig-inputs"><input type="text" id="n2" class="input-name" placeholder="Name"><input type="text" id="p2" class="input-title" placeholder="Position"></div>
                </div>
                <div class="sig-box">
                    <span class="sig-label">Department Head:</span>
                    <div class="sig-inputs"><input type="text" id="n3" class="input-name" placeholder="Name"><input type="text" id="p3" class="input-title" placeholder="Position"></div>
                </div>
                <div class="sig-box">
                    <span class="sig-label">Approved By:</span>
                    <div class="sig-inputs"><input type="text" id="n4" class="input-name" placeholder="Name"><input type="text" id="p4" class="input-title" placeholder="Position"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Supabase Init
        const _supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');

        // Hex ID Generation
        const hexID = Math.floor(Math.random() * 0xfffff).toString(16).toUpperCase().padStart(5, '0');
        const projectID = `MKTG-${hexID}`;
        document.getElementById('project-id-text').innerText = `ID: ${projectID}`;

        // QR Generation (Must use window.onload to ensure div exists)
        window.onload = function() {
            new QRCode(document.getElementById("qrcode"), {
                text: `https://your-domain.com/verify?id=${projectID}`,
                width: 100,
                height: 100
            });
        };

        // Fixed Image Preview Logic
        function previewFile(event) {
            const output = document.getElementById('img-preview');
            const hint = document.getElementById('hint');
            const reader = new FileReader();
            
            reader.onload = function(){
                output.src = reader.result;
                output.style.display = 'block'; // Show the image
                hint.style.display = 'none';    // Hide the text
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        async function saveToSupabase() {
            const file = document.getElementById('file-input').files[0];
            if (!file) { alert("Please upload an image first."); return; }

            const { data: uploadData, error: uploadError } = await _supabase.storage
                .from('project-images')
                .upload(`${projectID}.png`, file);

            if (uploadError) { alert("Upload error: " + uploadError.message); return; }

            const publicUrl = _supabase.storage.from('project-images').getPublicUrl(`${projectID}.png`).data.publicUrl;

            const { error: dbError } = await _supabase.from('projects').insert([{
                project_no: projectID,
                project_name: document.getElementById('proj_name').value,
                department: document.getElementById('dept_name').value,
                emailed_date: "04/08/2026",
                image_url: publicUrl,
                created_by_name: document.getElementById('n1').value,
                created_by_pos: document.getElementById('p1').value,
                supervisor_name: document.getElementById('n2').value,
                supervisor_pos: document.getElementById('p2').value,
                dept_head_name: document.getElementById('n3').value,
                dept_head_pos: document.getElementById('p3').value,
                approved_by_name: document.getElementById('n4').value,
                approved_by_pos: document.getElementById('p4').value
            }]);

            if (dbError) alert("DB Error: " + dbError.message);
            else alert("Project " + projectID + " Saved!");
        }
    </script>
</body>
</html>
