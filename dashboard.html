<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHMC Document Control - Rebuilt Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-blue: #0ef;
            --neon-green: #39ff14;
            --neon-purple: #bd00ff;
            --neon-orange: #ffb700;
            --bg-dark: #051321;
            --panel-bg: rgba(5, 19, 33, 0.75);
            --border-glow: rgba(0, 238, 255, 0.15);
            --text-light: #f5f7fa;
            --text-muted: #8da4b4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        
        body { 
            background: var(--bg-dark); 
            background-image: radial-gradient(circle at 50% 10%, #0d2a45 0%, var(--bg-dark) 70%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 25px;
        }

        .dashboard-container { 
            max-width: 1400px; 
            margin: auto; 
        }

        /* Glassmorphic Cyberpunk Navbar */
        .navbar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 25px; 
            background: var(--panel-bg); 
            padding: 15px 25px; 
            border-radius: 12px; 
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 238, 255, 0.05);
        }
        
        .brand {
            display: flex; 
            align-items: center; 
            gap: 15px;
        }
        .brand img {
            height: 40px;
            filter: drop-shadow(0 0 5px var(--neon-blue));
        }
        .brand h1 {
            color: var(--text-light);
            text-shadow: 0 0 10px var(--neon-blue);
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        /* Navigation Controls */
        .nav-links { display: flex; gap: 8px; }
        .nav-btn {
            text-decoration: none;
            color: var(--text-muted); 
            font-size: 0.75rem; 
            font-weight: 700; 
            padding: 10px 18px;
            border-radius: 6px; 
            border: 1px solid var(--border-glow); 
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.25s ease;
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-btn:hover, .nav-btn.active { 
            background: var(--neon-blue); 
            color: var(--bg-dark); 
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }
        .nav-btn.btn-logout { 
            border-color: rgba(255, 77, 77, 0.3); 
            color: #ff4d4d; 
        }
        .nav-btn.btn-logout:hover { 
            background: #ff4d4d; 
            color: white; 
            border-color: #ff4d4d;
            box-shadow: 0 0 10px #ff4d4d;
        }

        /* Table Architecture */
        .table-wrapper { 
            background: var(--panel-bg); 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .table-header { 
            padding: 20px 25px; 
            border-bottom: 1px solid var(--border-glow); 
        }
        .table-header h2 {
            font-size: 1.1rem;
            text-shadow: 0 0 8px var(--neon-blue);
            letter-spacing: 0.5px;
        }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { 
            background: rgba(0, 0, 0, 0.4); 
            color: var(--neon-blue); 
            padding: 16px 20px; 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-glow);
        }
        td { 
            padding: 16px 20px; 
            border-bottom: 1px solid rgba(0, 238, 255, 0.05); 
            font-size: 0.85rem; 
            color: var(--text-light);
        }
        tr.data-row { transition: background 0.2s; }
        tr.data-row:hover { background: rgba(0, 238, 255, 0.03); }

        /* Badges styling */
        .badge { 
            padding: 5px 10px; 
            border-radius: 4px; 
            font-size: 0.7rem; 
            font-weight: 800; 
            display: inline-block; 
            text-transform: uppercase;
        }
        .badge-active { background: rgba(0, 238, 255, 0.1); color: var(--neon-blue); border: 1px solid var(--neon-blue); }
        .badge-archive { background: rgba(57, 255, 20, 0.1); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .badge-inward { background: rgba(189, 0, 255, 0.1); color: #d666ff; border: 1px solid var(--neon-purple); }
        .badge-outward { background: rgba(255, 183, 0, 0.1); color: var(--neon-orange); border: 1px solid var(--neon-orange); }
    </style>
</head>
<body>

<div class="dashboard-container">
    
    <!-- NAVBAR -->
    <div class="navbar">
        <div class="brand">
            <img src="https://i.imgur.com/VbZKWAf.png" alt="PHMC Logo">
            <h1>DOC-CONTROL</h1>
        </div>
        <div class="nav-links">
            <button class="nav-btn active" id="btn-active" onclick="setView('active')">Active</button>
            <button class="nav-btn" id="btn-outgoing" onclick="setView('outgoing')">Outgoing</button>
            <button class="nav-btn" id="btn-inward" onclick="setView('inward')">Inward</button>
            <button class="nav-btn" id="btn-archived" onclick="setView('archived')">Archived</button>
            <a href="index.html" class="nav-btn btn-logout">Log Out</a>
        </div>
    </div>

    <!-- MAIN DATA TABLE -->
    <div class="table-wrapper">
        <div class="table-header">
            <h2 id="view-title">Active Documents</h2>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Date / Time</th>
                    <th>QR Code</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Handled By</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Initializing system components...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    // Initialize Supabase Client
    const supabaseUrl = 'https://onozvyuowebbwuvcqlzt.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ub3p2eXVvd2ViYnd1dmNxbHp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDc1NTQsImV4cCI6MjA5MjQyMzU1NH0.1EddoNcvgmQpO2eVZ8d4tXcDOJJC5BJNOckRRKJOzh0';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let currentView = 'active';

    // Formats dates reliably
    function formatTime(isoString) {
        if (!isoString) return '---';
        const d = new Date(isoString);
        return isNaN(d.getTime()) ? '---' : d.toLocaleString('en-PH', {
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
    }

    // Toggle navigation states
    function setView(viewName) {
        currentView = viewName;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        
        const activeBtn = document.getElementById(`btn-${viewName}`);
        if (activeBtn) activeBtn.classList.add('active');

        // Capitalize title
        document.getElementById('view-title').innerText = `${viewName.charAt(0).toUpperCase() + viewName.slice(1)} Documents`;
        
        fetchTrackerData();
    }

    // Query and structure database values
    async function fetchTrackerData() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Fetching logs...</td></tr>';

        try {
            // Fetch everything sorted by newest action first
            const { data: events, error } = await _supabase
                .from('document_tracking_events')
                .select('created_at, parent_qr_code, department, status, received_by, picked_up_by')
                .order('created_at', { ascending: false });

            if (error) throw error;
            if (!events || events.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">No historical data found.</td></tr>';
                return;
            }

            // Grouping logic to isolate the latest status event per unique QR Code
            const latestPerQR = {};
            events.forEach(event => {
                const qr = event.parent_qr_code;
                if (!latestPerQR[qr]) {
                    latestPerQR[qr] = event;
                }
            });

            const uniqueLatestEvents = Object.values(latestPerQR);

            // Filter data based on view
            let filteredEvents = [];
            if (currentView === 'active') {
                // Documents that are still flowing through departments (excluding Approved/Finished states)
                filteredEvents = uniqueLatestEvents.filter(e => {
                    const status = (e.status || '').toLowerCase();
                    return !status.includes('finish') && !status.includes('approve') && !status.includes('archive');
                });
            } else if (currentView === 'archived') {
                // Finished or Archived items
                filteredEvents = uniqueLatestEvents.filter(e => {
                    const status = (e.status || '').toLowerCase();
                    return status.includes('finish') || status.includes('approve') || status.includes('archive');
                });
            } else if (currentView === 'inward') {
                // Direct query for receiving transitions
                filteredEvents = events.filter(e => (e.status || '').toLowerCase().includes('received'));
            } else if (currentView === 'outgoing') {
                // Direct query for handoff transitions
                filteredEvents = events.filter(e => (e.status || '').toLowerCase().includes('picked up') || (e.status || '').toLowerCase().includes('forwarded'));
            }

            tbody.innerHTML = '';

            if (filteredEvents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">No documents match the "${currentView}" filter.</td></tr>`;
                return;
            }

            // Render table content
            filteredEvents.forEach(item => {
                const handler = (item.status || '').toLowerCase().includes('picked up') 
                    ? (item.picked_up_by || '---') 
                    : (item.received_by || '---');

                // Assign status pill style depending on state context
                let badgeClass = 'badge-active';
                if (currentView === 'archived') badgeClass = 'badge-badge-archive';
                if (currentView === 'inward') badgeClass = 'badge-inward';
                if (currentView === 'outgoing') badgeClass = 'badge-outward';

                const tr = document.createElement('tr');
                tr.className = 'data-row';
                tr.innerHTML = `
                    <td style="color: var(--neon-blue); font-weight: 600;">${formatTime(item.created_at)}</td>
                    <td style="font-family: monospace; letter-spacing: 0.5px;">${item.parent_qr_code || '---'}</td>
                    <td><strong>${item.department || '---'}</strong></td>
                    <td><span class="badge ${badgeClass}">${item.status || 'Unknown'}</span></td>
                    <td>${handler}</td>
                `;
                tbody.appendChild(tr);
            });

        } catch (err) {
            console.error("Fetch Error:", err);
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ff4d4d; padding: 30px;">Database communication error: ${err.message}</td></tr>`;
        }
    }

    // Set up Realtime listener connection
    function initRealtime() {
        _supabase.channel('tracking-refresh')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'document_tracking_events' }, () => {
                fetchTrackerData();
            })
            .subscribe();
    }

    // Fire off initialization
    document.addEventListener('DOMContentLoaded', () => {
        fetchTrackerData();
        initRealtime();
    });
</script>
</body>
</html>
