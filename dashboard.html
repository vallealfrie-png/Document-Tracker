<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHMC Document Control - Rebuilt Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-blue: #0ef;
            --neon-green: #39ff14;
            --neon-purple: #bd00ff;
            --neon-orange: #ffb700;
            --bg-dark: #051321;
            --panel-bg: rgba(5, 19, 33, 0.75);
            --border-glow: rgba(0, 238, 255, 0.15);
            --text-light: #f5f7fa;
            --text-muted: #8da4b4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        
        body { 
            background: var(--bg-dark); 
            background-image: radial-gradient(circle at 50% 10%, #0d2a45 0%, var(--bg-dark) 70%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 25px;
        }

        .dashboard-container { 
            max-width: 1400px; 
            margin: auto; 
        }

        /* Glassmorphic Cyberpunk Navbar */
        .navbar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 25px; 
            background: var(--panel-bg); 
            padding: 15px 25px; 
            border-radius: 12px; 
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 238, 255, 0.05);
        }
        
        .brand {
            display: flex; 
            align-items: center; 
            gap: 15px;
        }
        .brand img {
            height: 40px;
            filter: drop-shadow(0 0 5px var(--neon-blue));
        }
        .brand h1 {
            color: var(--text-light);
            text-shadow: 0 0 10px var(--neon-blue);
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        /* Navigation Controls */
        .nav-links { display: flex; gap: 8px; }
        .nav-btn {
            text-decoration: none;
            color: var(--text-muted); 
            font-size: 0.75rem; 
            font-weight: 700; 
            padding: 10px 18px;
            border-radius: 6px; 
            border: 1px solid var(--border-glow); 
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.25s ease;
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
        }
        .nav-btn:hover, .nav-btn.active { 
            background: var(--neon-blue); 
            color: var(--bg-dark); 
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }
        .nav-btn.btn-logout { 
            border-color: rgba(255, 77, 77, 0.3); 
            color: #ff4d4d; 
        }
        .nav-btn.btn-logout:hover { 
            background: #ff4d4d; 
            color: white; 
            border-color: #ff4d4d;
            box-shadow: 0 0 10px #ff4d4d;
        }

        /* Table Architecture */
        .table-wrapper { 
            background: var(--panel-bg); 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .table-header { 
            padding: 20px 25px; 
            border-bottom: 1px solid var(--border-glow); 
        }
        .table-header h2 {
            font-size: 1.1rem;
            text-shadow: 0 0 8px var(--neon-blue);
            letter-spacing: 0.5px;
        }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { 
            background: rgba(0, 0, 0, 0.4); 
            color: var(--neon-blue); 
            padding: 16px 20px; 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-glow);
        }
        td { 
            padding: 16px 20px; 
            border-bottom: 1px solid rgba(0, 238, 255, 0.05); 
            font-size: 0.85rem; 
            color: var(--text-light);
        }
        
        /* Interactive Row Styling */
        tr.data-row { 
            transition: background 0.2s; 
            cursor: pointer;
        }
        tr.data-row:hover { 
            background: rgba(0, 238, 255, 0.05); 
        }
        tr.data-row.expanded {
            background: rgba(0, 238, 255, 0.02);
        }

        /* Status Pill Colors */
        .badge { 
            padding: 5px 10px; 
            border-radius: 4px; 
            font-size: 0.7rem; 
            font-weight: 800; 
            display: inline-block; 
            text-transform: uppercase;
        }
        .badge-received { background: rgba(0, 238, 255, 0.1); color: var(--neon-blue); border: 1px solid var(--neon-blue); }
        .badge-pickup { background: rgba(255, 183, 0, 0.1); color: var(--neon-orange); border: 1px solid var(--neon-orange); }
        .badge-signed { background: rgba(57, 255, 20, 0.1); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .badge-archive { background: rgba(189, 0, 255, 0.1); color: #d666ff; border: 1px solid var(--neon-purple); }

        /* Collapse / Expand Elements */
        .history-row {
            display: none;
            background: rgba(0, 0, 0, 0.4);
        }
        .history-row.show {
            display: table-row;
        }
        .history-container {
            padding: 20px 40px;
            border-left: 3px solid var(--neon-blue);
            margin: 10px 0;
            background: rgba(0, 238, 255, 0.02);
        }
        .history-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        /* Visual Timeline */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 5px;
            bottom: 5px;
            width: 2px;
            background: rgba(0, 238, 255, 0.15);
        }
        .timeline-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            position: relative;
            font-size: 0.8rem;
        }
        .timeline-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--bg-dark);
            border: 2px solid var(--neon-blue);
            z-index: 1;
            margin-top: 2px;
            box-shadow: 0 0 6px var(--neon-blue);
        }
        .timeline-item.old-event .timeline-dot {
            border-color: var(--text-muted);
            box-shadow: none;
        }
        .timeline-content {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .timeline-time {
            color: var(--neon-blue);
            font-weight: 600;
            min-width: 130px;
        }
        .timeline-item.old-event .timeline-time {
            color: var(--text-muted);
        }
        .indicator-arrow {
            display: inline-block;
            transition: transform 0.2s ease;
            color: var(--neon-blue);
            font-weight: bold;
        }
        tr.expanded .indicator-arrow {
            transform: rotate(90deg);
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    
    <!-- NAVBAR -->
    <div class="navbar">
        <div class="brand">
            <img src="https://i.imgur.com/VbZKWAf.png" alt="PHMC Logo">
            <h1>DOC-CONTROL</h1>
        </div>
        <div class="nav-links">
            <button class="nav-btn active" id="btn-active" onclick="setView('active')">Active</button>
            <a href="https://vallealfrie-png.github.io/Document-Tracker/unified-log" class="nav-btn" target="_blank">Outgoing</a>
            <a href="https://vallealfrie-png.github.io/Document-Tracker/inbound" class="nav-btn" target="_blank">Inward</a>
            <button class="nav-btn" id="btn-archived" onclick="setView('archived')">Archived</button>
            <a href="index.html" class="nav-btn btn-logout">Log Out</a>
        </div>
    </div>

    <!-- MAIN DATA TABLE -->
    <div class="table-wrapper">
        <div class="table-header">
            <h2 id="view-title">Active Document Lifeline</h2>
        </div>
        <table>
            <thead>
                <tr>
                    <th style="width: 40px;"></th>
                    <th>Last Movement Time</th>
                    <th>QR Code</th>
                    <th>Current Department Location</th>
                    <th>Transition Status</th>
                    <th>Handled By</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">Initializing active tracks...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    // Initialize Supabase Client
    const supabaseUrl = 'https://onozvyuowebbwuvcqlzt.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ub3p2eXVvd2ViYnd1dmNxbHp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDc1NTQsImV4cCI6MjA5MjQyMzU1NH0.1EddoNcvgmQpO2eVZ8d4tXcDOJJC5BJNOckRRKJOzh0';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let currentView = 'active';

    // Formats dates reliably
    function formatTime(isoString) {
        if (!isoString) return '---';
        const d = new Date(isoString);
        return isNaN(d.getTime()) ? '---' : d.toLocaleString('en-PH', {
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
    }

    // Toggle row collapses
    function toggleHistory(qrCode) {
        const headerRow = document.getElementById(`row-master-${qrCode}`);
        const detailRow = document.getElementById(`row-detail-${qrCode}`);
        
        if (headerRow && detailRow) {
            const isShowing = detailRow.classList.contains('show');
            if (isShowing) {
                detailRow.classList.remove('show');
                headerRow.classList.remove('expanded');
            } else {
                detailRow.classList.add('show');
                headerRow.classList.add('expanded');
            }
        }
    }

    // Handle view switches
    function setView(viewName) {
        currentView = viewName;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        
        const activeBtn = document.getElementById(`btn-${viewName}`);
        if (activeBtn) activeBtn.classList.add('active');

        // Dynamic page titles
        if (viewName === 'active') {
            document.getElementById('view-title').innerText = "Active Document Lifeline";
        } else {
            document.getElementById('view-title').innerText = "Archived Documents";
        }
        
        fetchTrackerData();
    }

    // Main tracking query
    async function fetchTrackerData() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">Scanning real-time transactions...</td></tr>';

        try {
            // Fetch everything sorted by newest action first to build precise tracking timelines
            const { data: events, error } = await _supabase
                .from('document_tracking_events')
                .select('created_at, parent_qr_code, department, status, received_by, picked_up_by')
                .order('created_at', { ascending: false });

            if (error) throw error;
            if (!events || events.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">No historical data found.</td></tr>';
                return;
            }

            // Group ALL events under their respective parent_qr_codes chronologically
            const groupsByQR = {};
            events.forEach(event => {
                const qr = event.parent_qr_code;
                if (!qr) return;
                if (!groupsByQR[qr]) {
                    groupsByQR[qr] = [];
                }
                groupsByQR[qr].push(event);
            });

            // Extract the latest event for primary table rows
            const uniqueLatestEvents = [];
            Object.keys(groupsByQR).forEach(qr => {
                // Since our query was ordered newest first, the first item in each group array is the latest
                const latestEvent = groupsByQR[qr][0];
                uniqueLatestEvents.push({
                    latest: latestEvent,
                    history: groupsByQR[qr]
                });
            });

            // Sort the primary rows so the documents with the newest overall transactions appear first
            uniqueLatestEvents.sort((a, b) => new Date(b.latest.created_at) - new Date(a.latest.created_at));

            // Filter primary items based on view context
            let filteredGroups = [];
            if (currentView === 'active') {
                filteredGroups = uniqueLatestEvents.filter(item => {
                    const status = (item.latest.status || '').toLowerCase();
                    return !status.includes('finish') && !status.includes('approve') && !status.includes('archive');
                });
            } else if (currentView === 'archived') {
                filteredGroups = uniqueLatestEvents.filter(item => {
                    const status = (item.latest.status || '').toLowerCase();
                    return status.includes('finish') || status.includes('approve') || status.includes('archive');
                });
            }

            tbody.innerHTML = '';

            if (filteredGroups.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">No documents in "${currentView}" queue.</td></tr>`;
                return;
            }

            // Render interactive rows
            filteredGroups.forEach(group => {
                const mainItem = group.latest;
                const qrCode = mainItem.parent_qr_code;
                const statusStr = (mainItem.status || '').toLowerCase();
                
                // Determine the correct responsible handler
                let handler = '---';
                if (statusStr.includes('picked up')) {
                    handler = mainItem.picked_up_by || '---';
                } else {
                    handler = mainItem.received_by || '---';
                }

                // Color-code active state badges
                let badgeClass = 'badge-received';
                if (statusStr.includes('pick') || statusStr.includes('outgoing') || statusStr.includes('forward')) {
                    badgeClass = 'badge-pickup';
                } else if (statusStr.includes('sign') || statusStr.includes('approve')) {
                    badgeClass = 'badge-signed';
                } else if (currentView === 'archived') {
                    badgeClass = 'badge-archive';
                }

                // Build the collapsed timeline HTML string
                let timelineHTML = '';
                group.history.forEach((histEvent, index) => {
                    const isNewest = index === 0;
                    const hStatus = (histEvent.status || '').toLowerCase();
                    const hHandler = hStatus.includes('picked up') ? (histEvent.picked_up_by || '---') : (histEvent.received_by || '---');
                    
                    timelineHTML += `
                        <div class="timeline-item ${isNewest ? '' : 'old-event'}">
                            <div class="timeline-dot"></div>
                            <div class="timeline-content">
                                <span class="timeline-time">${formatTime(histEvent.created_at)}</span>
                                <span style="color: var(--text-light); min-width: 180px;">📍 <strong>${histEvent.department || '---'}</strong></span>
                                <span style="color: ${isNewest ? 'var(--neon-blue)' : 'var(--text-muted)'}; font-weight: 600; min-width: 140px;">${histEvent.status || 'Unknown'}</span>
                                <span style="color: var(--text-muted);">By: ${hHandler}</span>
                            </div>
                        </div>
                    `;
                });

                // Generate Master Tr row and corresponding Hidden history container row
                const trMaster = document.createElement('tr');
                trMaster.className = 'data-row';
                trMaster.id = `row-master-${qrCode}`;
                trMaster.onclick = () => toggleHistory(qrCode);
                trMaster.innerHTML = `
                    <td style="text-align: center;"><span class="indicator-arrow">▶</span></td>
                    <td style="color: var(--neon-blue); font-weight: 600;">${formatTime(mainItem.created_at)}</td>
                    <td style="font-family: monospace; letter-spacing: 0.5px;">${qrCode}</td>
                    <td><strong>${mainItem.department || '---'}</strong></td>
                    <td><span class="badge ${badgeClass}">${mainItem.status || 'Unknown'}</span></td>
                    <td>${handler}</td>
                `;

                const trDetail = document.createElement('tr');
                trDetail.className = 'history-row';
                trDetail.id = `row-detail-${qrCode}`;
                trDetail.innerHTML = `
                    <td colspan="6">
                        <div class="history-container">
                            <div class="history-title">Document Audit Trail (Newest First)</div>
                            <div class="timeline">
                                ${timelineHTML}
                            </div>
                        </div>
                    </td>
                `;

                tbody.appendChild(trMaster);
                tbody.appendChild(trDetail);
            });

        } catch (err) {
            console.error("Fetch Error:", err);
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #ff4d4d; padding: 30px;">Database communication error: ${err.message}</td></tr>`;
        }
    }

    // Set up Realtime listener connection
    function initRealtime() {
        _supabase.channel('tracking-refresh')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'document_tracking_events' }, () => {
                fetchTrackerData();
            })
            .subscribe();
    }

    // Fire off initialization
    document.addEventListener('DOMContentLoaded', () => {
        fetchTrackerData();
        initRealtime();
    });
</script>
</body>
</html>
