<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHMC Document Control - Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon: #0ef;
            --neon-hover: #0bc2cc;
            --bg-dark: #081b29;
            --panel-bg: rgba(8, 27, 41, 0.65);
            --border-glow: rgba(0, 238, 255, 0.2);
            --text-light: #ededed;
            --text-muted: #a2bccc;
            --success: #39ff14; /* Neon Green */
            --inbound: #bd00ff; /* Neon Purple */
            --warning: #ffb700; /* Neon Orange */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background: var(--bg-dark); 
            color: var(--text-light);
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
        }

        .dashboard-container { 
            max-width: 1400px; 
            margin: auto; 
        }

        /* Glassmorphic Cyberpunk Header */
        .header-flex { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 25px; 
            background: var(--panel-bg); 
            padding: 15px 25px; 
            border-radius: 12px; 
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 15px rgba(0, 238, 255, 0.1);
        }
        
        .header-title-area {
            display: flex; 
            align-items: center; 
            gap: 15px;
        }
        .header-title-area img {
            height: 45px;
            filter: drop-shadow(0 0 5px var(--neon));
        }
        .header-title-area h1 {
            color: var(--text-light);
            text-shadow: 0 0 8px var(--neon);
            font-size: 1.6rem;
            font-weight: 700;
        }

        /* Modern Navigation Buttons */
        .nav-links { display: flex; gap: 10px; align-items: center; }
        .nav-btn {
            display: flex; 
            align-items: center; 
            gap: 8px; 
            text-decoration: none;
            color: var(--text-muted); 
            font-size: 0.8rem; 
            font-weight: 700; 
            padding: 10px 16px;
            border-radius: 8px; 
            border: 1px solid var(--border-glow); 
            background: rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer; 
            text-transform: uppercase;
            user-select: none;
        }
        .nav-btn:hover, .nav-btn.active { 
            background: var(--neon); 
            color: var(--bg-dark); 
            border-color: var(--neon);
            box-shadow: 0 0 12px var(--neon);
        }
        .nav-btn.inbound-active { 
            background: var(--inbound); 
            color: white; 
            border-color: var(--inbound);
            box-shadow: 0 0 12px var(--inbound);
        }
        
        /* Logout Button Styles */
        .nav-btn.btn-logout { 
            border-color: rgba(217, 83, 79, 0.4); 
            color: #ff4d4d; 
        }
        .nav-btn.btn-logout:hover { 
            background: #ff4d4d; 
            color: white; 
            border-color: #ff4d4d;
            box-shadow: 0 0 12px #ff4d4d;
        }

        /* Sound Activation Banner */
        #sound-status { 
            cursor: pointer; 
            padding: 14px; 
            background: rgba(255, 183, 0, 0.1); 
            text-align: center; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            font-weight: bold; 
            border: 1px dashed var(--warning); 
            color: var(--warning);
            transition: 0.3s;
            text-shadow: 0 0 5px rgba(255, 183, 0, 0.3);
        }
        #sound-status:hover {
            background: rgba(255, 183, 0, 0.2);
            box-shadow: 0 0 10px rgba(255, 183, 0, 0.2);
        }

        /* Metrics Display Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { 
            background: var(--panel-bg); 
            padding: 22px; 
            border-radius: 12px; 
            border: 1px solid var(--border-glow);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            border-left: 5px solid var(--neon); 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--border-glow);
        }
        .stat-card h3 { margin: 0; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-card p { margin: 10px 0 0; font-size: 2.2rem; font-weight: 800; color: var(--text-light); text-shadow: 0 0 8px rgba(255,255,255,0.1); }

        /* Neon Table Container */
        .table-container { 
            background: var(--panel-bg); 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--border-glow);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); 
            margin-bottom: 30px; 
        }
        .table-header { 
            padding: 20px 25px; 
            background: rgba(0, 0, 0, 0.2); 
            border-bottom: 1px solid var(--border-glow); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .table-header h2 {
            font-size: 1.3rem;
            color: var(--text-light);
            text-shadow: 0 0 8px var(--neon);
        }
        
        table { width: 100%; border-collapse: collapse; }
        th { 
            background: rgba(0, 0, 0, 0.3); 
            color: var(--neon); 
            padding: 15px 20px; 
            text-align: left; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-glow);
        }
        td { 
            padding: 15px 20px; 
            border-bottom: 1px solid rgba(0, 238, 255, 0.08); 
            font-size: 0.9rem; 
            color: var(--text-light);
        }
        
        .doc-row { transition: background 0.2s ease; }
        .doc-row:hover { background: rgba(0, 238, 255, 0.05); cursor: pointer; }
        
        /* Expandable History Layout */
        .history-row { display: none; background: rgba(0,0,0,0.4); }
        .history-container { 
            padding: 25px 40px; 
            border-left: 5px solid var(--neon); 
            background: rgba(8, 27, 41, 0.9);
        }

        .btn-finish { 
            background: var(--success); 
            color: var(--bg-dark); 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 800; 
            float: right; 
            box-shadow: 0 0 10px var(--success);
            transition: 0.3s;
        }
        .btn-finish:hover {
            background: #2ee610;
            box-shadow: 0 0 18px var(--success);
        }

        /* Status Pill Badges */
        .status-badge { 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 800; 
            display: inline-block; 
            text-align: center;
            text-transform: uppercase;
        }
        .status-signed { background: rgba(57, 255, 20, 0.15); color: var(--success); border: 1px solid var(--success); box-shadow: 0 0 8px rgba(57, 255, 20, 0.1); }
        .status-received { background: rgba(0, 238, 255, 0.15); color: var(--neon); border: 1px solid var(--neon); box-shadow: 0 0 8px rgba(0, 238, 255, 0.1); }
        .status-pickup { background: rgba(255, 183, 0, 0.15); color: var(--warning); border: 1px solid var(--warning); box-shadow: 0 0 8px rgba(255, 183, 0, 0.1); }
        .status-inbound { background: rgba(189, 0, 255, 0.15); color: #d666ff; border: 1px solid var(--inbound); box-shadow: 0 0 8px rgba(189, 0, 255, 0.1); }
        .status-finished { background: rgba(237, 237, 237, 0.1); color: var(--text-light); border: 1px solid var(--text-light); }

        /* Real-time Cyberpunk Toast Notification */
        #notification-toast {
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            background: var(--bg-dark); 
            color: var(--text-light);
            padding: 20px; 
            border-radius: 12px; 
            display: none; 
            z-index: 1000;
            min-width: 320px; 
            border: 2px solid var(--neon);
            box-shadow: 0 0 20px var(--neon);
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideIn { from { transform: translateY(120%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<audio id="notif-sound" src="https://raw.githubusercontent.com/vallealfrie-png/Document-Tracker/main/mixkit-urgent-simple-tone-loop-2976.wav" preload="auto"></audio>

<div class="dashboard-container">
    
    <!-- HEADER -->
    <div class="header-flex">
        <div class="header-title-area">
            <img src="https://i.imgur.com/VbZKWAf.png" alt="PHMC Logo">
            <h1 id="page-title">Live Tracking View</h1>
        </div>
        
        <div class="nav-links">
            <div class="nav-btn active" id="nav-live" onclick="showView('live')">QR Tracking</div>
            <div class="nav-btn" id="nav-inbound" onclick="showView('inbound')">Inbound Logs</div>
            <a href="unified-log.html" class="nav-btn" id="nav-outbound">Outbound Logs</a>
            <div class="nav-btn" id="nav-finished" onclick="showView('finished')">Archive</div>
            <a href="index.html" class="nav-btn">Home</a>
            <div class="nav-btn btn-logout" onclick="handleLogout()">Log Out</div>
        </div>
    </div>

    <!-- AUDIO TOGGLE BANNER -->
    <div id="sound-status" onclick="enableAudio()">🔊 CLICK TO ENABLE REAL-TIME MONITORING SOUNDS</div>

    <!-- METRICS GRID -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>QR Active</h3>
            <p id="count-active">0</p>
        </div>
        <div class="stat-card" style="border-left-color: var(--inbound);">
            <h3>Inbound (Pending)</h3>
            <p id="count-inbound">0</p>
        </div>
        <div class="stat-card" style="border-left-color: var(--success);">
            <h3>Archived</h3>
            <p id="count-finished">0</p>
        </div>
        <div class="stat-card">
            <h3>System</h3>
            <p style="font-size: 1.1rem; color: var(--success); text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);">● REALTIME ONLINE</p>
        </div>
    </div>

    <!-- MAIN DATA TABLE -->
    <div class="table-container">
        <div class="table-header">
            <h2 id="table-title">Current Active Documents</h2>
        </div>
        <table>
            <thead>
                <tr id="table-head-row"></tr>
            </thead>
            <tbody id="scan-body"></tbody>
        </table>
    </div>
</div>

<!-- FLOATING NOTIFICATION TOAST -->
<div id="notification-toast">
    <div style="font-weight: 800; font-size: 0.75rem; text-transform: uppercase; color: var(--neon); margin-bottom: 8px; letter-spacing: 1px;">System Alert</div>
    <div id="toast-msg" style="font-size: 0.9rem; line-height: 1.4;"></div>
</div>

<script>
    const _supabase = supabase.createClient('https://onozvyuowebbwuvcqlzt.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ub3p2eXVvd2ViYnd1dmNxbHp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDc1NTQsImV4cCI6MjA5MjQyMzU1NH0.1EddoNcvgmQpO2eVZ8d4tXcDOJJC5BJNOckRRKJOzh0');
    
    let currentView = 'live'; 
    let audioEnabled = false;
    let currentUserDept = null; 
    let reloadTimeout = null;

    // Helper: Safely format dates to avoid browser runtime crashes on null or bad timestamps
    function formatDate(dateString, formatOptions = {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) {
        if (!dateString) return '---';
        try {
            const parsed = new Date(dateString);
            return isNaN(parsed.getTime()) ? '---' : parsed.toLocaleString('en-PH', formatOptions);
        } catch {
            return '---';
        }
    }

    // Helper: Throttles dashboard reloads so rapid realtime updates don't spam requests
    function debouncedReload() {
        if (reloadTimeout) clearTimeout(reloadTimeout);
        reloadTimeout = setTimeout(() => {
            loadDashboard();
        }, 300);
    }

    function enableAudio() {
        audioEnabled = true;
        const statusBanner = document.getElementById('sound-status');
        if (statusBanner) {
            statusBanner.innerHTML = "✅ REAL-TIME AUDIO ALERTS ACTIVE";
            statusBanner.style.background = "rgba(57, 255, 20, 0.1)";
            statusBanner.style.borderColor = "var(--success)";
            statusBanner.style.color = "var(--success)";
            statusBanner.style.textShadow = "0 0 5px rgba(57, 255, 20, 0.3)";
        }
    }

    function showView(view) {
        currentView = view;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active', 'inbound-active'));
        
        const activeBtn = document.getElementById(`nav-${view}`);
        if(activeBtn) {
            if(view === 'inbound') activeBtn.classList.add('inbound-active');
            else activeBtn.classList.add('active');
        }

        const titleText = view.charAt(0).toUpperCase() + view.slice(1);
        document.getElementById('page-title').innerText = `${titleText} View`;
        document.getElementById('table-title').innerText = 
            view === 'live' ? 'Current Active Documents' : 
            view === 'inbound' ? 'Inbound Documents Log' : 'Archived Documents';

        loadDashboard();
    }

    function applyDepartmentFilter(query, targetColumn = 'department') {
        if (currentUserDept) {
            return query.eq(targetColumn, currentUserDept);
        }
        return query;
    }

    async function handleLogout() {
        if (_supabase.auth && typeof _supabase.auth.signOut === 'function') {
            try {
                await _supabase.auth.signOut();
            } catch (err) {
                console.error("Session clear warning:", err);
            }
        }
        currentUserDept = null;
        window.location.href = 'index.html';
    }

    async function loadDashboard() {
        const scanBody = document.getElementById('scan-body');
        const headRow = document.getElementById('table-head-row');
        if (!scanBody || !headRow) return;

        scanBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:35px; color: var(--text-muted);">Syncing secure databases...</td></tr>';

        try {
            // Parallel execution for fast KPI metrics loading
            const [finishedRes, inboundRes] = await Promise.all([
                _supabase.from('finished_documents').select('*', { count: 'exact', head: true }),
                _supabase.from('inbound_logs').select('*', { count: 'exact', head: true })
            ]);

            document.getElementById('count-finished').innerText = finishedRes.count || 0;
            document.getElementById('count-inbound').innerText = inboundRes.count || 0;

            if (currentView === 'live') {
                headRow.innerHTML = `<th>Last Action</th><th>Document details</th><th>Department</th><th>Active Handler</th><th>Status</th>`;
                
                let scansQuery = _supabase.from('document_tracking_events').select('*').order('created_at', { ascending: false });
                scansQuery = applyDepartmentFilter(scansQuery, 'department');
                const { data: scans, error: scansErr } = await scansQuery;

                const { data: masterDocs } = await _supabase.from('combined_routing_logs').select('qr_code, project_name');
                const { data: finishedIDs } = await _supabase.from('finished_documents').select('qr_code');
                
                if (scansErr) throw scansErr;

                const nameMap = Object.fromEntries(masterDocs?.map(d => [d.qr_code, d.project_name]) || []);
                const finishedSet = new Set(finishedIDs?.map(f => f.qr_code));
                const grouped = {};

                scans?.forEach(s => {
                    if (finishedSet.has(s.parent_qr_code)) return;
                    if (!grouped[s.parent_qr_code]) grouped[s.parent_qr_code] = [];
                    grouped[s.parent_qr_code].push(s);
                });

                const sortedActiveDocs = Object.keys(grouped).map(qr => {
                    return {
                        qr_code: qr,
                        history: grouped[qr],
                        latestEvent: grouped[qr][0]
                    };
                }).sort((a, b) => new Date(b.latestEvent.created_at) - new Date(a.latestEvent.created_at));

                document.getElementById('count-active').innerText = sortedActiveDocs.length;
                scanBody.innerHTML = '';

                if(sortedActiveDocs.length === 0) {
                    scanBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:35px; color: var(--text-muted);">No active tracked documents found.</td></tr>';
                    return;
                }

                sortedActiveDocs.forEach(item => {
                    const qr = item.qr_code;
                    const history = item.history;
                    const latest = item.latestEvent;
                    const pName = nameMap[qr] || "Unknown Project";
                    
                    const row = document.createElement('tr');
                    row.className = 'doc-row';
                    row.onclick = () => toggleHistory(qr);
                    row.innerHTML = `
                        <td style="color: var(--neon); font-weight: 600;">${formatDate(latest.created_at)}</td>
                        <td><strong>${pName}</strong><br><small style="color: var(--text-muted); font-family: monospace;">${qr}</small></td>
                        <td><b style="color: var(--text-light);">${latest.department || '---'}</b></td>
                        <td>${latest.status === 'Picked Up' ? (latest.picked_up_by || '---') : (latest.received_by || '---')}</td>
                        <td><span class="status-badge ${getStatusClass(latest.status)}">${latest.status || 'Unknown'}</span></td>`;
                    
                    const hRow = document.createElement('tr');
                    hRow.id = `history-${qr}`;
                    hRow.className = 'history-row';
                    hRow.onclick = (e) => e.stopPropagation(); 
                    hRow.innerHTML = `
                        <td colspan="5">
                            <div class="history-container">
                                <button class="btn-finish" onclick="event.stopPropagation(); approveDocument('${qr}', '${pName}', '${latest.department || 'Unknown'}')">FINISH & ARCHIVE</button>
                                <h4 style="margin-top:0; margin-bottom: 15px; color: var(--neon); font-size: 0.95rem; text-shadow: 0 0 5px rgba(0,238,255,0.3);">Full Routing History</h4>
                                <table style="width:100%; background: rgba(0,0,0,0.3); border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);">
                                    ${history.map(h => `
                                        <tr>
                                            <td style="border-bottom: 1px solid rgba(255,255,255,0.02);">${formatDate(h.created_at, {month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'})}</td>
                                            <td style="border-bottom: 1px solid rgba(255,255,255,0.02);"><strong>${h.status}</strong> at ${h.department}</td>
                                            <td style="border-bottom: 1px solid rgba(255,255,255,0.02); color: var(--text-muted);">By: ${h.status==='Picked Up'? (h.picked_up_by || '---') : (h.received_by || '---')}</td>
                                        </tr>`).join('')}
                                </table>
                            </div>
                        </td>`;
                    scanBody.appendChild(row);
                    scanBody.appendChild(hRow);
                });

            } else if (currentView === 'inbound') {
                headRow.innerHTML = `<th>Received</th><th>Category</th><th>Project</th><th>Assigned To</th><th>Logged By</th><th>Status</th>`;
                
                let inboundQuery = _supabase.from('inbound_logs').select('*').order('created_at', { ascending: false });
                inboundQuery = applyDepartmentFilter(inboundQuery, 'department');
                const { data: inbounds } = await inboundQuery;
                
                scanBody.innerHTML = '';
                if(!inbounds || inbounds.length === 0) {
                    scanBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:35px; color: var(--text-muted);">No inbound records logged.</td></tr>';
                    return;
                }

                inbounds.forEach(log => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td style="color: var(--neon);">${formatDate(log.created_at, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</td>
                        <td><small style="text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted);">${log.category || '---'}</small></td>
                        <td><strong>${log.project_name || '---'}</strong></td>
                        <td>${log.assigned_to || '---'}</td>
                        <td>${log.logged_by || '---'}</td>
                        <td><span class="status-badge status-inbound">${log.status || 'Pending'}</span></td>`;
                    scanBody.appendChild(row);
                });

            } else {
                headRow.innerHTML = `<th>Finished Date</th><th>Project Name</th><th>Approved By</th><th>Final Dept</th><th>Status</th>`;
                const { data: finished } = await _supabase.from('finished_documents').select('*').order('completed_at', { ascending: false });
                
                scanBody.innerHTML = '';
                if(!finished || finished.length === 0) {
                    scanBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:35px; color: var(--text-muted);">No archived items found.</td></tr>';
                    return;
                }

                finished.forEach(f => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td style="color: var(--success);">${formatDate(f.completed_at, {month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'})}</td>
                        <td><strong>${f.project_name || '---'}</strong><br><small style="font-family: monospace; color: var(--text-muted);">${f.qr_code}</small></td>
                        <td>${f.approved_by || '---'}</td>
                        <td>${f.final_department || '---'}</td>
                        <td><span class="status-badge status-finished">ARCHIVED</span></td>`;
                    scanBody.appendChild(row);
                });
            }
        } catch (err) {
            console.error("Dashboard Error Encountered:", err);
            scanBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#ff4d4d; padding:35px;">Failed to process live logs: ${err.message}</td></tr>`;
        }
    }

    async function approveDocument(qr, name, finalDept) {
        const approver = prompt(`Final Approval: ${name}\nEnter your name:`);
        if (!approver) return;

        const { error: err1 } = await _supabase.from('finished_documents').insert([{
            qr_code: qr, project_name: name, approved_by: approver, final_department: finalDept
        }]);
        
        const { error: err2 } = await _supabase.from('document_tracking_events').insert([{
            parent_qr_code: qr, status: 'Approved/Finished', received_by: approver, department: 'FINAL ARCHIVE'
        }]);

        if (!err1 && !err2) {
            await _supabase.from('document_notifications').insert([{ qr_code: qr, message: `✅ DOCUMENT FINISHED: ${name} approved by ${approver}` }]);
            alert("Document Archived Successfully.");
            loadDashboard();
        } else {
            alert("Update Error: " + (err1?.message || err2?.message));
        }
    }

    function toggleHistory(qr) {
        const row = document.getElementById(`history-${qr}`);
        if(row) {
            row.style.display = row.style.display === 'table-row' ? 'none' : 'table-row';
        }
    }

    function getStatusClass(status) {
        const s = status?.toLowerCase() || '';
        if (s.includes('signed') && !s.includes('not')) return 'status-signed';
        if (s.includes('received')) return 'status-received';
        if (s.includes('picked up')) return 'status-pickup';
        return 'status-finished';
    }

    let toastTimer = null;
    function triggerAlert(msg) {
        const toast = document.getElementById('notification-toast');
        const toastMsg = document.getElementById('toast-msg');
        if(!toast || !toastMsg) return;

        toastMsg.innerText = msg;
        toast.style.display = 'block';
        if (audioEnabled) {
            const player = document.getElementById('notif-sound');
            if (player) {
                player.currentTime = 0;
                player.play().catch(e => console.log("Audio playback blocked:", e));
            }
        }
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 8000);
    }

    // Initialize session and real-time listeners
    async function initializeSessionAndRealtime() {
        try {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user && user.user_metadata) {
                currentUserDept = user.user_metadata.department || null;
            }
        } catch (e) {
            console.warn("User profile fetch skipped:", e);
        }

        loadDashboard();
        startListener();
    }

    function startListener() {
        _supabase.channel('global-updates').on('postgres_changes', 
            { event: 'INSERT', schema: 'public', table: 'document_notifications' }, 
            (payload) => { 
                triggerAlert(payload.new.message); 
                debouncedReload(); 
            }
        ).subscribe();
        
        _supabase.channel('inbound-updates').on('postgres_changes', 
            { event: 'INSERT', schema: 'public', table: 'inbound_logs' }, 
            (payload) => { 
                if (!currentUserDept || payload.new.department === currentUserDept) {
                    triggerAlert("New Inbound Document Logged!");
                }
                debouncedReload(); 
            }
        ).subscribe();
    }

    document.addEventListener('DOMContentLoaded', initializeSessionAndRealtime);
</script>
</body>
</html>
