<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHMC Verification</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .logo { width: 180px; margin-bottom: 20px; }
        .proj-img { width: 100%; border-radius: 8px; margin: 15px 0; border: 1px solid #ddd; max-height: 300px; object-fit: contain; }
        .label { color: #1a73ba; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; margin-top: 10px; }
        .val { font-size: 1.1rem; margin-bottom: 8px; color: #333; font-weight: bold; }
        .verified { color: #007b43; font-weight: bold; border: 2px solid #007b43; display: inline-block; padding: 5px 15px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://i.imgur.com/VbZKWAf.png" class="logo">
        <div id="loading">Verifying Project ID...</div>
        <div id="res" style="display:none;">
            <div class="label">Project Title</div>
            <div id="p-name" class="val"></div>
            <div class="label">Created By</div>
            <div id="p-user" class="val"></div>
            <img id="p-img" class="proj-img">
            <div class="verified">✓ AUTHENTIC DOCUMENT</div>
        </div>
    </div>
    <script>
        const _supabase = supabase.createClient('https://tywhjkofayqhmwbpzvlg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5d2hqa29mYXlxaG13YnB6dmxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MzA2ODYsImV4cCI6MjA5MTIwNjY4Nn0.F-mFKAhn5kRtAU1XOM5jMiT4-zL3P6YJ7Rtj9VGatH4');
        async function load() {
            const id = new URLSearchParams(window.location.search).get('id');
            const { data, error } = await _supabase.from('projects').select('*').eq('project_no', id).single();
            if (data) {
                document.getElementById('loading').style.display='none';
                document.getElementById('res').style.display='block';
                document.getElementById('p-name').innerText = data.project_name;
                document.getElementById('p-user').innerText = data.created_by_name;
                document.getElementById('p-img').src = data.image_url;
            } else { document.getElementById('loading').innerText = "Invalid Project ID."; }
        }
        load();
    </script>
</body>
</html>
