<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Tracking | PHMC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #1a73ba; --success: #28a745; --warning: #f39c12; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .track-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 450px; margin: auto; overflow: hidden; }
        
        .header { text-align: center; padding: 20px; background: #fff; border-bottom: 1px solid #eee; }
        .header img { width: 90px; }
        
        .tab-menu { display: flex; background: #f8f9fa; border-bottom: 1px solid #eee; }
        .tab-btn { flex: 1; padding: 15px 5px; border: none; background: none; font-size: 0.75rem; font-weight: bold; color: #888; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: #fff; }

        .interface-content { padding: 25px; display: none; animation: fadeIn 0.3s ease; }
        .interface-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .doc-summary { font-size: 0.85rem; color: #555; background: #eef6ff; padding: 10px; border-radius: 8px; margin: 15px 25px; text-align: center; }

        label { display: block; font-size: 0.7rem; font-weight: 700; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; font-size: 1rem; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; color: white; transition: 0.2s; }
        .btn-primary { background: var(--primary); }
        .btn-warning { background: var(--warning); }
        .btn-success { background: var(--success); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="track-card">
    <div class="header">
        <img src="https://i.imgur.com/VbZKWAf.png" alt="PHMC Logo">
        <div id="display-name" style="font-weight: bold; margin-top: 10px; color: #333;">Loading Project...</div>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab(event, 'view-receive')">1. Received</button>
        <button class="tab-btn" onclick="switchTab(event, 'view-status')">2. Status</button>
        <button class="tab-btn" onclick="switchTab(event, 'view-pickup')">3. Pick-up</button>
    </div>

    <div class="doc-summary" id="display-id">ID: ---</div>

    <div id="view-receive" class="interface-content active">
        <label>Your Name (Receiver)</label>
        <input type="text" id="rec_name" placeholder="Enter your full name">
        <label>Your Department</label>
        <input type="text" id="rec_dept" list="dept-list" placeholder="Select or type department">
        <button class="btn btn-primary" id="btn-rec" onclick="handleAction('Received')">LOG RECEIPT</button>
    </div>

    <div id="view-status" class="interface-content">
        <label>Current Department</label>
        <input type="text" id="stat_dept" list="dept-list" placeholder="Where is the document now?">
        <label>Set Signature Status</label>
        <select id="stat_val">
            <option value="Not Signed">❌ Not Signed</option>
            <option value="Signed">✅ Signed / Approved</option>
        </select>
        <button class="btn btn-warning" id="btn-stat" onclick="handleAction('Status')">UPDATE & NOTIFY</button>
    </div>

    <div id="view-pickup" class="interface-content">
        <label>Messenger Name (Picked up by)</label>
        <input type="text" id="pick_name" placeholder="Who is taking the document?">
        
        <label>Releasing From (Dept)</label>
        <input type="text" id="pick_dept_from" list="dept-list" placeholder="Dept releasing it">
        
        <label>Destination Department</label>
        <input type="text" id="pick_dept_to" list="dept-list" placeholder="Where is it going?">
        
        <button class="btn btn-success" id="btn-pick" onclick="handleAction('Picked Up')">LOG PICK-UP</button>
    </div>
</div>

<datalist id="dept-list"></datalist>

<script>
    const _supabase = supabase.createClient('https://tywhjkofayqhmwbpzvlg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5d2hqa29mYXlxaG13YnB6dmxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MzA2ODYsImV4cCI6MjA5MTIwNjY4Nn0.F-mFKAhn5kRtAU1XOM5jMiT4-zL3P6YJ7Rtj9VGatH4');
    const params = new URLSearchParams(window.location.search);
    const qrID = params.get('id');

    function switchTab(evt, tabId) {
        document.querySelectorAll('.interface-content').forEach(content => content.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    async function init() {
        if (!qrID) {
            document.getElementById('display-name').innerText = "Error: No ID found";
            return;
        }
        
        // Load Project Details
        const { data } = await _supabase.from('combined_routing_logs').select('*').eq('qr_code', qrID).single();
        if (data) {
            document.getElementById('display-name').innerText = data.project_name;
            document.getElementById('display-id').innerText = "ID: " + data.qr_code;
        }

        // Load Departments for the dropdown list
        loadDeptDropdown();
    }

    async function loadDeptDropdown() {
        const { data } = await _supabase.from('document_tracking_events').select('department');
        if (data) {
            // Filter unique names and remove nulls
            const uniqueDepts = [...new Set(data.map(item => item.department))].filter(Boolean);
            const list = document.getElementById('dept-list');
            list.innerHTML = uniqueDepts.map(d => `<option value="${d}">`).join('');
        }
    }

    async function handleAction(type) {
        let entryData = {
            parent_qr_code: qrID,
            created_at: new Date()
        };
        let msg = "";
        let btn;

        if (type === 'Received') {
            const name = document.getElementById('rec_name').value;
            const dept = document.getElementById('rec_dept').value;
            if (!name || !dept) return alert("Please fill in Name and Dept");
            
            btn = document.getElementById('btn-rec');
            entryData.received_by = name;
            entryData.department = dept;
            entryData.status = 'Received';
            msg = `📥 Document ${qrID} received by ${name} (${dept})`;
        } 
        else if (type === 'Status') {
            const dept = document.getElementById('stat_dept').value;
            const stat = document.getElementById('stat_val').value;
            if (!dept) return alert("Please enter the current department");

            btn = document.getElementById('btn-stat');
            entryData.received_by = 'Update Only'; 
            entryData.department = dept;
            entryData.status = stat; 
            msg = `📝 Status Update: ${qrID} marked as ${stat} at ${dept}`;
        } 
        else if (type === 'Picked Up') {
            const messenger = document.getElementById('pick_name').value;
            const deptFrom = document.getElementById('pick_dept_from').value;
            const deptTo = document.getElementById('pick_dept_to').value; // Destination

            if (!messenger || !deptFrom || !deptTo) return alert("Please fill in Messenger, Releasing Dept, and Destination");

            btn = document.getElementById('btn-pick');
            entryData.picked_up_by = messenger; 
            entryData.department = deptTo; // We save the DESTINATION as the current department column
            entryData.status = 'Picked Up';
            msg = `🚚 Document ${qrID} picked up by ${messenger} from ${deptFrom} heading to ${deptTo}`;
        }

        btn.disabled = true;
        btn.innerText = "PROCESSING...";

        const { error: logErr } = await _supabase.from('document_tracking_events').insert([entryData]);

        if (!logErr) {
            await _supabase.from('document_notifications').insert([{
                qr_code: qrID,
                message: msg
            }]);
            alert(type + " logged successfully!");
            btn.innerText = "SUCCESS";
            loadDeptDropdown(); // Refresh the list for the next scan
        } else {
            console.error(logErr);
            alert("Error: " + logErr.message);
            btn.disabled = false;
            btn.innerText = "RETRY";
        }
    }

    init();
</script>
</body>
</html>
