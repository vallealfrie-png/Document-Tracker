<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Tracking | PHMC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #1a73ba; --success: #28a745; --warning: #f39c12; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .track-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 450px; margin: auto; overflow: hidden; }
        
        .header { text-align: center; padding: 20px; background: #fff; border-bottom: 1px solid #eee; }
        .header img { width: 90px; }
        
        /* Tab Navigation */
        .tab-menu { display: flex; background: #f8f9fa; border-bottom: 1px solid #eee; }
        .tab-btn { flex: 1; padding: 15px 5px; border: none; background: none; font-size: 0.75rem; font-weight: bold; color: #888; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: #fff; }

        .interface-content { padding: 25px; display: none; animation: fadeIn 0.3s ease; }
        .interface-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .doc-summary { font-size: 0.85rem; color: #555; background: #eef6ff; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; }

        label { display: block; font-size: 0.7rem; font-weight: 700; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; font-size: 1rem; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; color: white; transition: 0.2s; }
        .btn-primary { background: var(--primary); }
        .btn-warning { background: var(--warning); }
        .btn-success { background: var(--success); }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="track-card">
    <div class="header">
        <img src="https://i.imgur.com/VbZKWAf.png" alt="PHMC Logo">
        <div id="display-name" style="font-weight: bold; margin-top: 10px; color: #333;">Loading Project...</div>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab(event, 'view-receive')">1. Received</button>
        <button class="tab-btn" onclick="switchTab(event, 'view-status')">2. Status</button>
        <button class="tab-btn" onclick="switchTab(event, 'view-pickup')">3. Pick-up</button>
    </div>

    <div class="doc-summary" id="display-id">ID: ---</div>

    <div id="view-receive" class="interface-content active">
        <label>Your Name (Receiver)</label>
        <input type="text" id="rec_name" placeholder="Enter your full name">
        <label>Your Department</label>
        <input type="text" id="rec_dept" placeholder="e.g. Finance, HR">
        <button class="btn btn-primary" onclick="handleAction('Received')">LOG RECEIPT</button>
    </div>

    <div id="view-status" class="interface-content">
        <label>Department Updating</label>
        <input type="text" id="stat_dept" placeholder="Current location">
        <label>Set Signature Status</label>
        <select id="stat_val">
            <option value="Not Signed">❌ Not Signed</option>
            <option value="Signed">✅ Signed / Approved</option>
        </select>
        <button class="btn btn-warning" onclick="handleAction('Status')">UPDATE & NOTIFY</button>
    </div>

    <div id="view-pickup" class="interface-content">
        <label>Messenger Name</label>
        <input type="text" id="pick_name" placeholder="Who is taking the document?">
        <label>Releasing Department</label>
        <input type="text" id="pick_dept" placeholder="Origin department">
        <button class="btn btn-success" onclick="handleAction('Picked Up')">LOG PICK-UP</button>
    </div>
</div>

<script>
    const _supabase = supabase.createClient('https://tywhjkofayqhmwbpzvlg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5d2hqa29mYXlxaG13YnB6dmxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MzA2ODYsImV4cCI6MjA5MTIwNjY4Nn0.F-mFKAhn5kRtAU1XOM5jMiT4-zL3P6YJ7Rtj9VGatH4');
    const params = new URLSearchParams(window.location.search);
    const qrID = params.get('id');

    // UI Tab Logic
    function switchTab(evt, tabId) {
        document.querySelectorAll('.interface-content').forEach(content => content.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    // Fetch Project Data
    async function init() {
        const { data } = await _supabase.from('combined_routing_logs').select('*').eq('qr_code', qrID).single();
        if (data) {
            document.getElementById('display-name').innerText = data.project_name;
            document.getElementById('display-id').innerText = "ID: " + data.qr_code;
        }
    }

    // Single Logic Function to handle all 3 interfaces
    async function handleAction(type) {
        let name, dept, status, msg;

        if (type === 'Received') {
            name = document.getElementById('rec_name').value;
            dept = document.getElementById('rec_dept').value;
            status = 'Received';
            msg = `📥 Document ${qrID} received by ${name} (${dept})`;
        } 
        else if (type === 'Status') {
            name = "System Update";
            dept = document.getElementById('stat_dept').value;
            status = document.getElementById('stat_val').value;
            msg = `📝 Status Update: ${qrID} marked as ${status} at ${dept}`;
        } 
        else if (type === 'Picked Up') {
            name = document.getElementById('pick_name').value;
            dept = document.getElementById('pick_dept').value;
            status = 'Picked Up';
            msg = `🚚 Document ${qrID} picked up by ${name} from ${dept}`;
        }

        if (!dept || (type !== 'Status' && !name)) {
            alert("Please complete all fields.");
            return;
        }

        // 1. Log to document_tracking_events (For the Dashboard Table)
        const { error: logErr } = await _supabase.from('document_tracking_events').insert([{
            parent_qr_code: qrID,
            received_by: name,
            department: dept,
            status: status
        }]);

        // 2. Send Notification (For the Dashboard Pop-up)
        const { error: notifErr } = await _supabase.from('document_notifications').insert([{
            qr_code: qrID,
            message: msg
        }]);

        if (!logErr && !notifErr) {
            alert(type + " logged successfully!");
            // Optional: Clear fields
            if(type === 'Received') document.getElementById('rec_name').value = "";
        } else {
            alert("Error saving data.");
        }
    }

    init();
</script>
</body>
</html>
