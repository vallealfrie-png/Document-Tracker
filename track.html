<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Tracking | PHMC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #1a73ba; --success: #28a745; --warning: #f39c12; --danger: #d9534f; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; margin: 0; padding: 15px; }
        .track-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        .header { text-align: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 15px; }
        .header img { width: 100px; }
        
        .doc-info { background: #eef6ff; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid var(--primary); font-size: 0.9rem; }
        
        /* Step Sections */
        .step-section { border: 1px solid #ddd; padding: 15px; border-radius: 10px; margin-bottom: 20px; background: #fff; }
        .step-title { font-size: 0.8rem; font-weight: bold; color: var(--primary); text-transform: uppercase; margin-bottom: 12px; display: block; }
        
        label { display: block; font-size: 0.7rem; font-weight: bold; color: #666; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; font-size: 1rem; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-receive { background: var(--primary); color: white; }
        .btn-status { background: var(--warning); color: white; }
        .btn-pickup { background: var(--success); color: white; }
        .btn:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="track-card">
    <div class="header">
        <img src="https://i.imgur.com/VbZKWAf.png" alt="PHMC Logo">
        <h2 style="margin:0; font-size: 1.1rem;">Document Tracking Portal</h2>
    </div>

    <div id="doc-details" class="doc-info">
        <strong id="display-name">Loading...</strong><br>
        <span id="display-id" style="font-family: monospace;">ID: ---</span>
    </div>

    <div class="step-section">
        <span class="step-title">Step 1: Receive Document</span>
        <label>Your Name (Receiver)</label>
        <input type="text" id="received_by" placeholder="Full Name">
        <label>Current Department</label>
        <input type="text" id="dept" placeholder="e.g. HR, Finance">
        <button class="btn btn-receive" onclick="logReceive()">LOG RECEIPT</button>
    </div>

    <div class="step-section">
        <span class="step-title">Step 2: Sign-off Status</span>
        <label>Action Taken</label>
        <select id="status">
            <option value="Not Signed">Mark as: Not Signed</option>
            <option value="Signed">Mark as: Signed / Approved</option>
        </select>
        <button class="btn btn-status" onclick="logStatus()">UPDATE STATUS & NOTIFY</button>
    </div>

    <div class="step-section" style="border-color: var(--success);">
        <span class="step-title">Step 3: Pick-up / Take out</span>
        <label>Picked up by (Messenger Name)</label>
        <input type="text" id="picked_up_by" placeholder="Name of person taking it">
        <button class="btn btn-pickup" onclick="logPickup()">LOG PICKUP</button>
    </div>
</div>

<script>
    const _supabase = supabase.createClient('https://tywhjkofayqhmwbpzvlg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5d2hqa29mYXlxaG13YnB6dmxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MzA2ODYsImV4cCI6MjA5MTIwNjY4Nn0.F-mFKAhn5kRtAU1XOM5jMiT4-zL3P6YJ7Rtj9VGatH4');
    const params = new URLSearchParams(window.location.search);
    const qrID = params.get('id');

    async function loadInfo() {
        const { data } = await _supabase.from('combined_routing_logs').select('*').eq('qr_code', qrID).single();
        if (data) {
            document.getElementById('display-name').innerText = data.project_name;
            document.getElementById('display-id').innerText = "ID: " + data.qr_code;
        }
    }

    // Helper: Sends alert to Dashboard
    async function dashNotify(msg) {
        await _supabase.from('document_notifications').insert([{ qr_code: qrID, message: msg }]);
    }

    // ACTION 1: RECEIVE
    async function logReceive() {
        const name = document.getElementById('received_by').value;
        const dept = document.getElementById('dept').value;
        if(!name || !dept) return alert("Fill Name and Dept");

        const { error } = await _supabase.from('document_tracking_events').insert([{
            parent_qr_code: qrID, received_by: name, department: dept, status: 'Received'
        }]);

        if (!error) {
            await dashNotify(`📥 ${qrID} received by ${name} (${dept})`);
            alert("Received logged!");
        }
    }

    // ACTION 2: STATUS
    async function logStatus() {
        const stat = document.getElementById('status').value;
        const dept = document.getElementById('dept').value || "Current Dept";
        
        const { error } = await _supabase.from('document_tracking_events').insert([{
            parent_qr_code: qrID, status: stat, department: dept, received_by: 'Status Update'
        }]);

        if (!error) {
            await dashNotify(`📝 ${qrID} status updated to: ${stat}`);
            alert("Status updated!");
        }
    }

    // ACTION 3: PICKUP
    async function logPickup() {
        const messenger = document.getElementById('picked_up_by').value;
        const dept = document.getElementById('dept').value || "Current Dept";
        if(!messenger) return alert("Enter Messenger Name");

        const { error } = await _supabase.from('document_tracking_events').insert([{
            parent_qr_code: qrID, received_by: messenger, department: dept, status: 'Picked Up'
        }]);

        if (!error) {
            await dashNotify(`🚚 ${qrID} picked up by ${messenger} from ${dept}`);
            alert("Pickup logged!");
        }
    }

    loadInfo();
</script>
</body>
</html>
